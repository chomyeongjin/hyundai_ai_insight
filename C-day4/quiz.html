<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Day 4 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow study column — setup strip, a make-style progress line, one question card at a time */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#17202b; --dim:#5b6878; --line:#d9dfe6;
  --accent:#0f6f8a; --accent-ink:#ffffff; --accent-soft:#e1f0f4;
  --ok:#1d7a3e; --ok-soft:#e3f3e8; --bad:#b4232f; --bad-soft:#fbe7e8; --warn:#9a5b00;
  --code-bg:#eef1f4;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#151d27; --fg:#dde5ee; --dim:#8d9aab; --line:#263243;
  --accent:#4fb8d4; --accent-ink:#06222b; --accent-soft:#12303a;
  --ok:#58c98a; --ok-soft:#12301f; --bad:#f07a83; --bad-soft:#3a1519; --warn:#e8b04f;
  --code-bg:#0b1118; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#151d27; --fg:#dde5ee; --dim:#8d9aab; --line:#263243;
  --accent:#4fb8d4; --accent-ink:#06222b; --accent-soft:#12303a;
  --ok:#58c98a; --ok-soft:#12301f; --bad:#f07a83; --bad-soft:#3a1519; --warn:#e8b04f;
  --code-bg:#0b1118; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:flex;flex-direction:column;gap:18px}
header h1{font-size:1.65rem;margin:0;text-wrap:balance;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--dim);font-size:.92rem}
code,pre,.mono{font-family:var(--f-mono)}
code{background:var(--code-bg);padding:1px 5px;border-radius:4px;font-size:.88em}

.setup{display:flex;flex-direction:column;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:4px 12px;font:inherit;font-size:.86rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.row label{display:flex;gap:6px;align-items:center;font-size:.9rem;cursor:pointer}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:.9rem;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.status{display:flex;flex-direction:column;gap:6px}
.statline{font-family:var(--f-mono);font-size:.82rem;color:var(--dim);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.statline b{color:var(--fg);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)} .bar .r{background:var(--bad)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.qmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--dim)}
.qmeta .id{font-family:var(--f-mono);color:var(--accent);font-weight:600}
.prompt{font-size:1.06rem;font-weight:500;margin:0}
pre.qc{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;font-size:.86rem;line-height:1.55;white-space:pre}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;font-size:.95rem;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);cursor:pointer;min-width:0}
.opt .k{font-family:var(--f-mono);font-size:.8rem;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 6px;line-height:1.6;flex:none}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{border-color:var(--ok);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{border-color:var(--bad);color:var(--bad)}
.fb{border-left:3px solid var(--ok);background:var(--ok-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.92rem}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb .v{font-weight:700;margin-right:4px}
.fb .ok-t{color:var(--ok)} .fb .bad-t{color:var(--bad)}
.fb .src{display:block;margin-top:4px;font-size:.8rem;color:var(--dim)}
.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hint{font-size:.78rem;color:var(--dim)}

.result h2{margin:0;font-size:1.3rem}
.log{font-family:var(--f-mono);font-size:.85rem;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre;margin:0}
.log .w{color:var(--warn)} .log .e{color:var(--bad)} .log .o{color:var(--ok)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
td.n{text-align:right;font-family:var(--f-mono)}
.wrong{display:flex;flex-direction:column;gap:10px}
.witem{border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:.9rem;display:flex;flex-direction:column;gap:4px;min-width:0}
.witem .id{font-family:var(--f-mono);color:var(--accent);font-size:.8rem;font-weight:600}
.witem .my{color:var(--bad)} .witem .co{color:var(--ok);font-weight:600}
.witem .ex{color:var(--dim);font-size:.85rem}
.empty{color:var(--dim);font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.btn{transition:background-color .12s,border-color .12s}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>C Day 4 퀴즈</h1>
    <p>파일 I/O·디버깅·종합 프로젝트 · 개념 워크시트 80문항 (8교시 × 10). 보기를 고르면 바로 채점되고 해설이 나옵니다.</p>
  </header>

  <section class="setup" aria-label="출제 설정">
    <div>
      <div class="label">출제 범위</div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="row">
      <label><input type="checkbox" id="shufQ" checked> 문제 순서 섞기</label>
      <label><input type="checkbox" id="shufO" checked> 보기 순서 섞기</label>
    </div>
    <div class="btns">
      <button class="btn primary" id="startBtn">이 범위로 새로 시작</button>
      <button class="btn" id="noteBtn">오답노트 풀기</button>
      <button class="btn" id="clearNoteBtn">오답노트 비우기</button>
    </div>
  </section>

  <section class="status" aria-live="polite">
    <div class="statline"><span id="statL"></span><span id="statR"></span></div>
    <div class="bar"><i class="g" id="barG"></i><i class="r" id="barR"></i></div>
  </section>

  <main id="stage"></main>
</div>

<script>
const Q=[{"t":"1교시 · 파일 열고 닫기","anim":"D4-1 파일 스트림 뷰어","qs":[{"p":"fopen 이 실패했을 때 반환값과 올바른 처리는?","c":"FILE *fp = fopen(\"temps.txt\", \"r\");\n____","o":["0 을 반환, 무시해도 된다","NULL 을 반환 — 사용 전에 검사하고 perror 로 원인 출력","예외를 던진다","-1 을 반환"],"a":1,"w":"검사 없이 fgets(…, fp) 하면 NULL 역참조로 세그폴트. Day 2 malloc 검사와 같은 규칙입니다.","an":"D4-1 · nope.txt"},{"p":"로그 파일을 실행할 때마다 이어 쓰려면 어떤 모드로 열어야 합니까?","c":"FILE *log = fopen(\"events.log\", ____);","o":["\"r\"","\"w\" — 새로 쓰기","\"a\" — 끝에 덧붙이기","\"r+\""],"a":2,"w":"\"w\" 는 기존 내용을 지우고 시작합니다. 오늘 가장 흔한 사고가 로그를 \"w\" 로 열어 이전 기록이 사라지는 것.","an":"1교시 예제 1-3"},{"p":"아래 코드에서 errno 를 먼저 변수에 복사한 이유는?","c":"if (!fp) {\n    int err = errno;\n    printf(\"...\");\n    perror(\"fopen\");\n}","o":["errno 가 지역 변수라서","errno 는 전역이라 그 뒤에 부른 함수(printf 등)가 덮어쓸 수 있기 때문","perror 가 errno 를 0 으로 만들어서","문법 규칙"],"a":1,"w":"실패 직후 읽어야 정확합니다. MCU 에서는 errno 대신 반환값 규약을 씁니다(6교시).","an":"1교시 예제 1-2"},{"p":"파일을 2000번 열고 닫지 않는 루프를 돌리면 어떻게 됩니까?","c":"for (int i = 0; i &lt; 2000; i++) {\n    FILE *fp = fopen(\"temps.txt\", \"r\");\n    // fclose 없음\n}","o":["문제 없음","약 1000번째에서 fopen 이 \"Too many open files\" 로 실패한다","메모리 부족으로 죽는다","컴파일 에러"],"a":1,"w":"프로세스가 동시에 열 수 있는 파일 수 한계(보통 1024)입니다. fopen/fclose 는 malloc/free 와 같은 짝 규칙.","an":"1교시 예제 1-4"},{"p":"stdin, stdout, stderr 의 정체는?","c":"","o":["정수 상수","미리 열려 있는 FILE * 세 개","문자열","매크로 함수"],"a":1,"w":"fgets(line, n, stdin) 의 stdin 자리에 fopen 결과를 넣으면 파일에서 읽습니다. 어제까지 배운 코드가 그대로 파일에 쓰입니다.","an":"1교시 예제 1-1"},{"p":"\"r\" 모드로 연 파일에 fprintf 하면 어떻게 됩니까?","c":"FILE *fp = fopen(\"temps.txt\", \"r\");\nfprintf(fp, \"hello\\n\");","o":["파일에 써진다","실패 — fprintf 가 음수를 반환하고 파일은 그대로","자동으로 \"w\" 로 바뀐다","세그폴트"],"a":1,"w":"읽기 전용 스트림에는 쓸 수 없습니다. 반환값을 검사하지 않으면 조용히 실패합니다.","an":"D4-1 · \"r\" 에 쓰기"},{"p":"main(int argc, char *argv[]) 에서 argv[1] 을 쓰기 전에 argc 를 검사하는 이유는?","c":"if (argc &lt; 2) { fprintf(stderr, \"usage: %s file\\n\", argv[0]); return 1; }\nFILE *fp = fopen(argv[1], \"r\");","o":["속도","인자 없이 실행하면 argv[1] 이 NULL 이라 fopen 에 넘기면 세그폴트","argc 는 항상 1 이라","C 문법 규칙"],"a":1,"w":"argv 는 Day 2 의 char * 배열이고 argv[argc] 는 NULL 입니다.","an":"1교시 빈칸 1-1"},{"p":"파일을 이미 fp 로 열어 둔 상태에서 같은 변수에 다시 fopen 을 대입하면?","c":"fp = fopen(\"a.txt\", \"r\");\nfp = fopen(\"b.txt\", \"r\");   // fclose 없이","o":["a.txt 가 자동으로 닫힌다","a.txt 는 열린 채 남고 그 핸들을 잃는다 — 파일 핸들 누수","b.txt 가 열리지 않는다","컴파일 에러"],"a":1,"w":"Day 2 malloc 을 free 없이 덮어쓰는 것과 같은 실수입니다. 먼저 fclose.","an":"D4-1 · 이미 열린 fp"},{"p":"프로그램이 종료 코드 1 로 끝나야 하는 상황은?","c":"","o":["정상 처리 완료","파일을 못 열었거나 인자가 잘못됐을 때 — 셸/Makefile 이 실패를 알 수 있게","항상 1 로 끝낸다","0 과 1 은 차이 없다"],"a":1,"w":"Day 1 의 $? 입니다. 스크립트에서 ./logger || echo 실패 처럼 분기할 수 있습니다.","an":"8교시 체크리스트"},{"p":"\"r+\" 와 \"w+\" 의 차이는?","c":"","o":["차이 없음","\"r+\" 는 기존 내용을 유지한 채 읽기·쓰기, \"w+\" 는 내용을 지우고 읽기·쓰기","\"w+\" 는 읽기 전용","\"r+\" 는 파일이 없으면 만든다"],"a":1,"w":"3교시 patch_temp 가 \"r+b\" 를 쓰는 이유입니다. \"w+b\" 로 열면 레코드가 전부 사라집니다.","an":"3교시 빈칸 3-1"}]},{"t":"2교시 · 텍스트 쓰기와 CSV","anim":"D4-2 텍스트 vs 바이너리","qs":[{"p":"printf(\"...\") 와 같은 뜻의 호출은?","c":"","o":["fprintf(stdin, \"...\")","fprintf(stdout, \"...\")","fprintf(stderr, \"...\")","fputs(\"...\", NULL)"],"a":1,"w":"printf 는 fprintf 의 첫 인자가 stdout 으로 고정된 것입니다. 파일 하나만 더 넘기면 파일에 씁니다.","an":"2교시 예제 2-1"},{"p":"오류 메시지를 stderr 로 보내는 이유는?","c":"./logger temps.txt &gt; out.txt","o":["stderr 가 더 빠르다","&gt; 로 stdout 을 파일에 담아도 stderr 는 화면에 남아 오류를 놓치지 않기 때문","stderr 는 버퍼링이 없어서만","C 규칙"],"a":1,"w":"2&gt;/dev/null 로 오류만 버리거나, 2&gt;err.log 로 따로 담을 수도 있습니다. 어제 LOG 매크로가 stderr 였던 이유.","an":"2교시 예제 2-1"},{"p":"fprintf 로 쓴 직후 다른 터미널에서 cat 했더니 파일이 비어 있었습니다. 원인은?","c":"fprintf(out, \"sensor started\\n\");\nsleep(10);    // 이 사이에 cat buf.txt → 비어 있음","o":["fprintf 버그","출력이 메모리 버퍼에 모여 있고 아직 디스크에 쓰이지 않았기 때문 — fflush 나 fclose 가 필요","파일 권한","sleep 이 파일을 잠근다"],"a":1,"w":"파일 스트림은 블록 단위(보통 4KB) 버퍼링입니다. 프로그램이 죽으면 버퍼 내용은 사라집니다.","an":"2교시 예제 2-2 · D4-1"},{"p":"로그를 줄마다 확실히 기록하는 방법은?","c":"","o":["printf 를 쓴다","fprintf 뒤에 fflush(fp), 또는 setvbuf 로 줄 단위 버퍼링","파일을 매번 새로 만든다","sleep 을 넣는다"],"a":1,"w":"성능은 조금 떨어지지만 전원이 나가도 마지막 줄까지 남습 const MARK=['1','2','3','4'];
const NOTE_KEY='c-day4-quiz-wrong';
const $=s=>document.querySelector(s);

function loadNote(){try{return new Set(JSON.parse(localStorage.getItem(NOTE_KEY)||'[]'))}catch(e){return new Set()}}
function saveNote(){try{localStorage.setItem(NOTE_KEY,JSON.stringify([...note]))}catch(e){}}
let note=loadNote();

const sel=new Set(Q.map((_,i)=>i));
let deck=[],idx=0,mode='range';

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function qid(s,k){return `Q${s+1}-${k+1}`}

function build(items){
  const so=$('#shufO').checked;
  deck=items.map(([s,k])=>({s,k,order:so?shuffle([0,1,2,3]):[0,1,2,3],pick:null}));
  if($('#shufQ').checked) shuffle(deck);
  idx=0;
}
function startRange(){
  mode='range';
  const items=[];[...sel].sort((a,b)=>a-b).forEach(s=>Q[s].qs.forEach((_,k)=>items.push([s,k])));
  build(items);render();
}
function startNote(){
  const items=[...note].map(x=>x.split('-').map(Number)).filter(([s,k])=>Q[s]&&Q[s].qs[k]);
  if(!items.length)return;
  mode='note';build(items);render();
}
function startItems(items,m){mode=m;build(items);render()}

function renderChips(){
  $('#chips').innerHTML=Q.map((s,i)=>`<button class="chip" aria-pressed="${sel.has(i)}" data-i="${i}" title="${s.t}">${i+1}교시</button>`).join('')+
    `<button class="chip" id="allChip" aria-pressed="${sel.size===Q.length}">전체</button>`;
  $('#chips').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);renderChips()});
  $('#allChip').onclick=()=>{if(sel.size===Q.length)sel.clear();else Q.forEach((_,i)=>sel.add(i));renderChips()};
  $('#startBtn').disabled=sel.size===0;
  $('#startBtn').textContent=sel.size?`이 범위로 새로 시작 (${sel.size*10}문항)`:'교시를 하나 이상 고르세요';
}
function renderNoteBtn(){
  $('#noteBtn').textContent=`오답노트 풀기 (${note.size})`;
  $('#noteBtn').disabled=note.size===0;$('#clearNoteBtn').disabled=note.size===0;
}

function counts(){let ok=0,bad=0;deck.forEach(d=>{if(d.pick===null)return;Q[d.s].qs[d.k].a===d.pick?ok++:bad++});return{ok,bad,done:ok+bad}}
function renderStatus(){
  const {ok,bad,done}=counts(),n=deck.length;
  $('#statL').innerHTML=`[ <b>${String(done).padStart(String(n).length,' ')}/${n}</b> ] ${mode==='note'?'오답노트':mode==='retry'?'틀린 문제 다시':'출제 범위'}`;
  $('#statR').innerHTML=`맞힘 <b>${ok}</b> · 틀림 <b>${bad}</b>${done?` · 정답률 <b>${Math.round(ok/done*100)}%</b>`:''}`;
  $('#barG').style.width=n?ok/n*100+'%':'0';$('#barR').style.width=n?bad/n*100+'%':'0';
}

function render(){
  renderNoteBtn();renderStatus();
  if(idx>=deck.length){renderResult();return}
  const d=deck[idx],sec=Q[d.s],q=sec.qs[d.k],done=d.pick!==null;
  const opts=d.order.map((oi,pos)=>{
    let cls='';if(done){if(oi===q.a)cls='ok';else if(oi===d.pick)cls='bad'}
    return `<button class="opt ${cls}" data-o="${oi}" ${done?'disabled':''}><span class="k">${MARK[pos]}</span><span>${q.o[oi]}</span></button>`}).join('');
  const right=done&&d.pick===q.a;
  $('#stage').innerHTML=`<article class="card">
    <div class="qmeta"><span><span class="id">${qid(d.s,d.k)}</span> · ${sec.t}</span><span>${idx+1} / ${deck.length}</span></div>
    <p class="prompt">${q.p}</p>
    ${q.c?`<pre class="qc">${q.c}</pre>`:''}
    <div class="opts">${opts}</div>
    ${done?`<div class="fb ${right?'':'bad'}"><span class="v ${right?'ok-t':'bad-t'}">${right?'정답입니다.':'오답입니다.'}</span>${q.w}<span class="src">강의 확인: ${q.an} · 🎬 ${sec.anim}</span></div>`:''}
    <div class="nav">
      <button class="btn" id="prevBtn" ${idx===0?'disabled':''}>이전</button>
      <span class="hint">키보드: 1–4 선택 · Enter 다음 · ← 이전</span>
      <button class="btn primary" id="nextBtn" ${done?'':'disabled'}>${idx===deck.length-1?'결과 보기':'다음 문제'}</button>
    </div></article>`;
  $('#stage').querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.o));
  $('#prevBtn').onclick=prev;$('#nextBtn').onclick=next;
}
function choose(oi){
  const d=deck[idx];if(d.pick!==null)return;d.pick=oi;
  const id=`${d.s}-${d.k}`;
  if(oi===Q[d.s].qs[d.k].a)note.delete(id);else note.add(id);
  saveNote();render();
}
function next(){if(deck[idx]&&deck[idx].pick!==null){idx++;render();window.scrollTo({top:0})}}
function prev(){if(idx>0){idx--;render()}}

function strip(h){const e=document.createElement('div');e.innerHTML=h;return e.textContent}
function renderResult(){
  const {ok,bad}=counts(),n=deck.length,skip=n-ok-bad;
  const per={};deck.forEach(d=>{const p=per[d.s]||(per[d.s]={n:0,ok:0});p.n++;if(d.pick===Q[d.s].qs[d.k].a)p.ok++});
  const wrong=deck.filter(d=>d.pick!==Q[d.s].qs[d.k].a).sort((a,b)=>a.s-b.s||a.k-b.k);
  const log=`$ make quiz\n`+Object.keys(per).map(Number).sort((a,b)=>a-b).map(s=>{const p=per[s],miss=p.n-p.ok;
    return `${Q[s].t.split(' · ')[0]}.c: ${miss?`<span class="w">${miss} warning${miss>1?'s':''}</span>`:'<span class="o">ok</span>'} (${p.ok}/${p.n})`}).join('\n')+
    `\n${bad+skip?`<span class="e">quiz: ${bad+skip}개 틀림</span> · `:'<span class="o">경고 0개 — 제출 조건 통과</span> · '}${ok}/${n} 맞힘 (${Math.round(ok/n*100)}%)`;
  $('#stage').innerHTML=`<article class="card result">
    <h2>결과 ${ok} / ${n}</h2>
    <pre class="log">${log}</pre>
    <div class="btns">
      ${wrong.length?`<button class="btn primary" id="retryBtn">틀린 ${wrong.length}문제 다시 풀기</button>`:''}
      <button class="btn" id="againBtn">같은 범위 처음부터</button>
    </div>
    <div class="label">틀린 문제 정리</div>
    <div class="wrong">${wrong.length?wrong.map(d=>{const q=Q[d.s].qs[d.k];
      return `<div class="witem"><span class="id">${qid(d.s,d.k)}</span><div>${q.p}</div>
        <div class="my">내 답: ${d.pick===null?'미응답':q.o[d.pick]}</div>
        <div class="co">정답: ${q.o[q.a]}</div><div class="ex">${q.w}</div></div>`}).join(''):'<p class="empty">틀린 문제가 없습니다.</p>'}</div>
  </article>`;
  const r=$('#retryBtn');if(r)r.onclick=()=>startItems(wrong.map(d=>[d.s,d.k]),'retry');
  $('#againBtn').onclick=()=>startItems(deck.map(d=>[d.s,d.k]),mode);
}

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  if(idx>=deck.length)return;
  if(/^[1-4]$/.test(e.key)){const b=$('#stage').querySelectorAll('.opt')[+e.key-1];if(b&&!b.disabled)b.click()}
  else if(e.key==='Enter'){if(document.activeElement&&document.activeElement.tagName==='BUTTON')return;next()}
  else if(e.key==='ArrowLeft')prev();
});
$('#startBtn').onclick=startRange;$('#noteBtn').onclick=startNote;
$('#clearNoteBtn').onclick=()=>{note.clear();saveNote();renderNoteBtn()};

renderChips();startRange();
</script>

</body>
</html>
