<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Day 1 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow study column — setup strip, a make-style progress line, one question card at a time */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#17202b; --dim:#5b6878; --line:#d9dfe6;
  --accent:#0f6f8a; --accent-ink:#ffffff; --accent-soft:#e1f0f4;
  --ok:#1d7a3e; --ok-soft:#e3f3e8; --bad:#b4232f; --bad-soft:#fbe7e8; --warn:#9a5b00;
  --code-bg:#eef1f4;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#151d27; --fg:#dde5ee; --dim:#8d9aab; --line:#263243;
  --accent:#4fb8d4; --accent-ink:#06222b; --accent-soft:#12303a;
  --ok:#58c98a; --ok-soft:#12301f; --bad:#f07a83; --bad-soft:#3a1519; --warn:#e8b04f;
  --code-bg:#0b1118; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#151d27; --fg:#dde5ee; --dim:#8d9aab; --line:#263243;
  --accent:#4fb8d4; --accent-ink:#06222b; --accent-soft:#12303a;
  --ok:#58c98a; --ok-soft:#12301f; --bad:#f07a83; --bad-soft:#3a1519; --warn:#e8b04f;
  --code-bg:#0b1118; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:flex;flex-direction:column;gap:18px}
header h1{font-size:1.65rem;margin:0;text-wrap:balance;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--dim);font-size:.92rem}
code,pre,.mono{font-family:var(--f-mono)}
code{background:var(--code-bg);padding:1px 5px;border-radius:4px;font-size:.88em}

.setup{display:flex;flex-direction:column;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:4px 12px;font:inherit;font-size:.86rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.row label{display:flex;gap:6px;align-items:center;font-size:.9rem;cursor:pointer}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:.9rem;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.status{display:flex;flex-direction:column;gap:6px}
.statline{font-family:var(--f-mono);font-size:.82rem;color:var(--dim);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.statline b{color:var(--fg);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)} .bar .r{background:var(--bad)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.qmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--dim)}
.qmeta .id{font-family:var(--f-mono);color:var(--accent);font-weight:600}
.prompt{font-size:1.06rem;font-weight:500;margin:0}
pre.qc{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;font-size:.86rem;line-height:1.55;white-space:pre}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;font-size:.95rem;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);cursor:pointer;min-width:0}
.opt .k{font-family:var(--f-mono);font-size:.8rem;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 6px;line-height:1.6;flex:none}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{border-color:var(--ok);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{border-color:var(--bad);color:var(--bad)}
.fb{border-left:3px solid var(--ok);background:var(--ok-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.92rem}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb .v{font-weight:700;margin-right:4px}
.fb .ok-t{color:var(--ok)} .fb .bad-t{color:var(--bad)}
.fb .src{display:block;margin-top:4px;font-size:.8rem;color:var(--dim)}
.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hint{font-size:.78rem;color:var(--dim)}

.result h2{margin:0;font-size:1.3rem}
.log{font-family:var(--f-mono);font-size:.85rem;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre;margin:0}
.log .w{color:var(--warn)} .log .e{color:var(--bad)} .log .o{color:var(--ok)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
td.n{text-align:right;font-family:var(--f-mono)}
.wrong{display:flex;flex-direction:column;gap:10px}
.witem{border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:.9rem;display:flex;flex-direction:column;gap:4px;min-width:0}
.witem .id{font-family:var(--f-mono);color:var(--accent);font-size:.8rem;font-weight:600}
.witem .my{color:var(--bad)} .witem .co{color:var(--ok);font-weight:600}
.witem .ex{color:var(--dim);font-size:.85rem}
.empty{color:var(--dim);font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.btn{transition:background-color .12s,border-color .12s}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>C Day 1 퀴즈</h1>
    <p>C 기초와 컴파일 과정 · 개념 워크시트 80문항 (8교시 × 10). 보기를 고르면 바로 채점되고 해설이 나옵니다.</p>
  </header>

  <section class="setup" aria-label="출제 설정">
    <div>
      <div class="label">출제 범위</div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="row">
      <label><input type="checkbox" id="shufQ" checked> 문제 순서 섞기</label>
      <label><input type="checkbox" id="shufO" checked> 보기 순서 섞기</label>
    </div>
    <div class="btns">
      <button class="btn primary" id="startBtn">이 범위로 새로 시작</button>
      <button class="btn" id="noteBtn">오답노트 풀기</button>
      <button class="btn" id="clearNoteBtn">오답노트 비우기</button>
    </div>
  </section>

  <section class="status" aria-live="polite">
    <div class="statline"><span id="statL"></span><span id="statR"></span></div>
    <div class="bar"><i class="g" id="barG"></i><i class="r" id="barR"></i></div>
  </section>

  <main id="stage"></main>
</div>

<script>
const Q=[{"t":"1교시 · 개발환경과 첫 컴파일","anim":"D1-1 빌드 파이프라인","qs":[{"p":"터미널에서 아래 명령을 실행했습니다. 출력 파일 이름을 지정하는 옵션을 쓰지 않았을 때 gcc 가 만들어 내는 실행파일의 이름은 무엇입니까?","c":"$ gcc hello.c\n$ ls","o":["hello","hello.exe","a.out","main"],"a":2,"w":"-o 옵션이 없으면 gcc 는 관례적으로 a.out 이라는 이름으로 실행파일을 만듭니다. 이름을 정하려면 -o 이름 을 붙입니다.","an":"D1-1 · 링커 단계"},{"p":"hello.c 를 컴파일해서 hello 라는 이름의 실행파일을 만들고 싶습니다. 올바른 명령은 무엇입니까?","c":"","o":["gcc hello.c -o hello","gcc -c hello.c hello","gcc hello.c &gt; hello","gcc --name hello hello.c"],"a":0,"w":"-o 뒤가 출력 파일 이름입니다. -c 는 오브젝트 파일까지만 만들고 멈추는 옵션이고, &gt; 는 셸 리다이렉션이라 gcc 옵션이 아닙니다.","an":"D1-1"},{"p":"main 함수의 return 값을 7 로 바꾸고 아래처럼 실행했습니다. 두 번째 줄 echo 가 출력하는 값은 무엇입니까?","c":"int main(void) {\n    printf(\"센서 초기화 실패\\n\");\n    return 7;\n}\n\n$ ./hello; echo $?","o":["0","7","에러 메시지","아무것도 출력되지 않음"],"a":1,"w":"main 의 반환값은 프로세스의 종료 코드가 되고, 셸 변수 $? 로 직전 프로그램의 종료 코드를 읽을 수 있습니다. 0 은 정상, 0 이 아니면 비정상 종료라는 약속입니다.","an":"1교시 예제 1-2"},{"p":"아래 코드는 #include &lt;stdio.h&gt; 없이 printf 를 호출합니다. -Wall -Wextra 로 컴파일하면 어떤 일이 일어납니까?","c":"int main(void) {\n    printf(\"Hello\\n\");\n    return 0;\n}","o":["아무 문제 없이 컴파일된다","실행할 때 크래시가 난다","implicit declaration 경고 또는 에러가 난다 (C99 이후 에러)","링크 단계에서만 에러가 난다"],"a":2,"w":"헤더는 함수의 원형(선언)을 알려줍니다. 선언이 없으면 컴파일러가 printf 의 인자와 반환 타입을 알 수 없어 암시적 선언 에러를 냅니다.","an":"1교시 예제 1-3 · D1-2"},{"p":"C 의 main 함수를 <code>int main(void)<\/code> 라고 씁니다. 여기서 괄호 안의 void 는 무엇을 뜻합니까?","c":"","o":["반환값이 없다는 뜻","인자를 하나도 받지 않는다는 뜻","main 을 static 으로 만든다는 뜻","생략한 것과 완전히 같다"],"a":1,"w":"매개변수 자리의 void 는 \"인자 없음\"을 명시합니다. 반환형은 앞의 int 이며, main 은 종료 코드를 정수로 돌려줍니다.","an":"1교시"},{"p":"오늘 하루 종일 켜 두기로 한 <code>-Wall<\/code> 옵션은 무슨 역할을 합니까?","c":"$ gcc -Wall -Wextra -o app app.c","o":["최적화를 켠다","자주 하는 실수에 대한 경고를 켠다","모든 경고를 에러로 바꾼다","디버그 정보를 넣는다"],"a":1,"w":"-Wall 은 흔한 실수를 잡는 경고 모음입니다. 경고를 에러로 바꾸는 것은 -Werror, 디버그 정보는 -g, 최적화는 -O2 입니다.","an":"준비 · 옵션 표"},{"p":"printf 의 문자열 안에 있는 <code>\\n<\/code> 은 화면에 어떻게 나타납니까?","c":"printf(\"Hello\\n\");","o":["역슬래시와 n 두 글자가 그대로 출력된다","줄바꿈 문자 하나로 처리된다","탭으로 처리된다","문자열이 거기서 끝난다"],"a":1,"w":"백슬래시로 시작하는 이스케이프 시퀀스는 한 문자입니다. \\n 은 줄바꿈, \\t 는 탭, \\0 은 문자열 끝을 뜻하는 널 문자입니다.","an":"1교시"},{"p":"C 프로젝트에서 소스 파일과 헤더 파일에 붙이는 관례적인 확장자는 무엇입니까?","c":"","o":[".c 와 .h",".cpp 와 .hpp",".c 와 .inc",".cc 와 .h"],"a":0,"w":".cpp .cc 는 C++ 확장자입니다. gcc 는 확장자를 보고 어떤 언어로 컴파일할지 판단하므로 확장자를 정확히 쓰는 것이 중요합니다.","an":"1교시"},{"p":"Day 4 에서 gdb 디버거를 쓰기 위해 아래처럼 컴파일하려고 합니다. -g 옵션은 어떤 목적으로 붙입니까?","c":"$ gcc -g hello.c -o hello","o":["실행 속도를 높이기 위해","디버거가 소스 줄 번호와 변수 이름을 볼 수 있는 정보를 넣기 위해","경고를 끄기 위해","정적 링크를 하기 위해"],"a":1,"w":"-g 가 있어야 gdb 에서 소스 줄 번호와 변수 이름을 보며 추적할 수 있습니다. 릴리스 빌드에서는 보통 뺍니다.","an":"Day 4 예고"},{"p":"수강생이 hello.c 의 문자열을 고친 뒤 컴파일하지 않고 ./hello 만 다시 실행했더니 옛날 문자열이 출력됐습니다. 이 현상을 가장 잘 설명한 것은 무엇입니까?","c":"","o":["파일 저장이 안 된 것이다","C 는 컴파일 언어라서 소스를 고치면 다시 컴파일해야 실행파일이 바뀐다","터미널 캐시 문제다","printf 는 원래 한 번만 바뀐다"],"a":1,"w":"실행파일은 컴파일 시점의 소스를 번역한 결과입니다. 소스를 고쳐도 다시 gcc 를 돌리기 전까지 실행파일은 그대로입니다.","an":"1교시 예제 1-1 · D1-1"}]},{"t":"2교시 · 빌드 과정 해부","anim":"D1-1 빌드 파이프라인","qs":[{"p":"gcc hello.c -o hello 한 줄은 내부적으로 네 단계를 거칩니다. 올바른 순서는 무엇입니까?","c":"","o":["컴파일 → 전처리 → 어셈블 → 링크","전처리 → 컴파일 → 어셈블 → 링크","전처리 → 어셈블 → 컴파일 → 링크","링크 → 컴파일 → 어셈블 → 전처리"],"a":1,"w":"전처리기가 #include/#define 을 풀고, 컴파일러가 C 를 어셈블리로, 어셈블러가 어셈블리를 기계어로 바꾸고, 링커가 오브젝트와 라이브러리를 합칩니다.","an":"D1-1 · 4단계"},{"p":"#include 와 #define 만 처리한 결과(전처리 결과)를 파일로 보고 싶습니다. 어떤 옵션을 써야 합니까?","c":"$ gcc ____ hello.c -o hello.i","o":["-S","-E","-c","-P"],"a":1,"w":"-E 는 전처리까지만 하고 멈춥니다. -S 는 어셈블리까지, -c 는 오브젝트 파일까지입니다.","an":"D1-1 · 전처리기"},{"p":"아래 명령을 실행하면 어떤 파일이 만들어집니까?","c":"$ gcc -S hello.c","o":["hello.i (전처리 결과)","hello.s (어셈블리)","hello.o (오브젝트)","hello (실행파일)"],"a":1,"w":"-S 는 컴파일 단계에서 멈춰 어셈블리 파일 .s 를 만듭니다. .i 는 전처리, .o 는 어셈블 결과입니다.","an":"D1-1 · 컴파일러"},{"p":"6줄짜리 hello.c 를 전처리했더니 hello.i 가 800줄이 넘었습니다. 이렇게 길어진 이유는 무엇입니까?","c":"$ wc -l hello.c hello.i\n   6 hello.c\n 815 hello.i","o":["최적화 코드가 추가돼서","#include &lt;stdio.h&gt; 가 헤더 파일 내용을 그 자리에 통째로 붙여넣기 때문","주석이 자동으로 생성돼서","에러 메시지가 들어가서"],"a":1,"w":"#include 는 지정한 파일을 그 위치에 복사해 넣으라는 지시입니다. stdio.h 가 다시 포함하는 헤더들까지 전부 들어옵니다.","an":"D1-1 · hello.i"},{"p":"오브젝트 파일에 nm 을 실행했더니 아래처럼 나왔습니다. puts 앞의 U 는 무엇을 뜻합니까?","c":"$ nm hello.o\n                 U puts\n0000000000000000 T main","o":["puts 가 이 파일에서 정의됨","puts 가 아직 해결되지 않음(undefined) — 링커가 채워야 함","puts 가 삭제됨","puts 가 유니코드 함수임"],"a":1,"w":"오브젝트 파일은 다른 파일이나 라이브러리에 있는 함수의 주소를 아직 모릅니다. U(undefined) 심볼은 링크 단계에서 해결됩니다. T 는 이 파일에 코드가 있다는 뜻입니다.","an":"D1-1 · hello.o"},{"p":"hello.s 를 열어 보니 우리가 쓴 printf 대신 puts 를 호출하고 있었습니다. 컴파일러가 이렇게 바꾼 이유는 무엇입니까?","c":"printf(\"Hello, C!\\n\");      ← 소스\n\ncall    puts@PLT             ← hello.s","o":["컴파일러 버그","서식 지정자가 없고 줄바꿈으로 끝나는 출력은 더 단순한 puts 로 최적화하기 때문","puts 가 C 표준이라서","printf 가 더 이상 지원되지 않아서"],"a":1,"w":"서식(%d 등)이 없는 단순 문자열 출력은 puts 가 더 빠릅니다. 컴파일러가 코드를 \"그대로\" 번역하지 않는다는 첫 번째 예입니다.","an":"D1-1 · hello.s"},{"p":"링크 단계에서 합쳐지는 입력은 무엇입니까?","c":"","o":["헤더 파일(.h)","오브젝트 파일들(.o)과 라이브러리(libc 등)","소스 파일(.c)","전처리 결과(.i)"],"a":1,"w":"링커의 입력은 .o 와 .a/.so 입니다. 헤더는 이미 전처리 단계에서 소비되어 링커는 헤더를 보지 않습니다.","an":"D1-1 · 링커 + libc"},{"p":"아래 코드는 read_sensor 를 선언만 하고 본문을 쓰지 않았습니다. gcc -c 는 성공했지만 링크에서 에러가 났습니다. 이 에러는 어느 단계의 에러입니까?","c":"int read_sensor(void);      // 선언만\nint main(void) {\n    printf(\"%d\\n\", read_sensor());\n}\n\n$ gcc link_err.o -o link_err\nundefined reference to `read_sensor'","o":["전처리","컴파일","링크","실행"],"a":2,"w":"선언이 있으니 컴파일러는 만족합니다. 정의(본문)를 어느 오브젝트 파일에서도 찾지 못했을 때 링커가 undefined reference 를 냅니다. 함수 이름 오타, .c 파일 누락, -lm 누락이 단골 원인입니다.","an":"2교시 예제 2-4"},{"p":"같은 hello.c 를 -O0 과 -O2 로 어셈블리를 만들어 비교했더니 -O2 쪽이 더 짧았습니다. 짧아진 이유는 무엇입니까?","c":"$ gcc -S -O0 hello.c -o o0.s\n$ gcc -S -O2 hello.c -o o2.s\n$ wc -l o0.s o2.s\n  45 o0.s\n  42 o2.s","o":["주석을 제거해서","불필요한 프레임 설정·저장 명령을 최적화로 없애서","문자열을 압축해서","오류로 일부가 빠져서"],"a":1,"w":"-O0 는 디버깅하기 쉽게 그대로 번역하고, -O2 는 프레임 포인터 생략·tail call 등으로 명령을 줄입니다. 임베디드 릴리스는 -O2 또는 크기 우선 -Os 를 씁니다.","an":"2교시 예제 2-5"},{"p":"아래 명령은 무엇을 보여줍니까?","c":"$ objdump -d hello.o","o":["원본 소스 코드","전처리 결과","오브젝트 안의 기계어를 어셈블리로 다시 풀어 쓴 것(디스어셈블)","링크 맵"],"a":2,"w":"objdump -d 는 오브젝트 파일의 바이트를 사람이 읽을 수 있는 어셈블리로 역변환합니다. 아직 채워지지 않은 호출 주소(00 00 00 00)를 직접 볼 수 있습니다.","an":"D1-1 · hello.o"}]},{"t":"3교시 · 헤더/소스 분리와 Makefile","anim":"D1-2 헤더 가드","qs":[{"p":"프로젝트를 sensor.h / sensor.c / main.c 로 나눌 때, 헤더 파일 sensor.h 에 넣기 알맞은 것은 무엇입니까?","c":"","o":["함수의 본문","함수 선언(원형), 구조체·typedef 정의, 매크로","main 함수","전역 변수의 정의"],"a":1,"w":"헤더는 \"무엇이 있는지\"를 알리는 곳입니다. 실제 본문(정의)은 .c 에 두어야 여러 파일이 같은 헤더를 포함해도 중복 정의가 생기지 않습니다.","an":"3교시 예제 3-1"},{"p":"main.c 가 a.h 와 b.h 를 포함하고, 두 헤더가 모두 common.h 를 포함합니다. common.h 에 아래 내용이 있고 헤더 가드가 없을 때 에러가 나는 줄은 어느 것입니까?","c":"// common.h (가드 없음)\ntypedef struct { int x, y; } Point;\nint add(int a, int b);","o":["int add 선언이 두 번 나와서","typedef struct 정의가 두 번 나와서","두 줄 모두","아무 에러도 나지 않는다"],"a":1,"w":"함수 선언은 반복해도 되지만 타입·구조체 정의는 한 번만 허용됩니다. 두 번째 include 에서 redefinition 에러가 납니다.","an":"D1-2 · 가드 없음"},{"p":"위 문제의 에러를 막기 위해 common.h 에 넣는 헤더 가드의 올바른 형태는 무엇입니까?","c":"","o":["#if COMMON_H … #endif","#ifndef COMMON_H / #define COMMON_H / … / #endif","#include once","#guard COMMON_H"],"a":1,"w":"매크로가 아직 정의되지 않았으면 정의하고 본문을 포함하고, 이미 정의돼 있으면 본문을 통째로 건너뜁니다. 가드 이름은 파일명_H 대문자가 관례입니다.","an":"D1-2 · 가드 있음"},{"p":"아래 두 include 문의 차이는 무엇입니까?","c":"#include \"sensor.h\"\n#include &lt;stdio.h&gt;","o":["차이가 없다","따옴표는 현재 디렉터리를 먼저 찾고, 꺾쇠는 시스템 경로만 찾는다","꺾쇠가 더 빠르다","따옴표는 C++ 전용이다"],"a":1,"w":"내가 만든 헤더는 따옴표, 표준·시스템 헤더는 꺾쇠를 씁니다.","an":"3교시 예제 3-1"},{"p":"아래 Makefile 을 실행했더니 \"missing separator\" 에러가 났습니다. 가장 가능성이 높은 원인은 무엇입니까?","c":"app: main.o sensor.o\n    gcc -o app main.o sensor.o     ← 이 줄에서 에러","o":["gcc 오타","명령 줄 앞이 탭이 아니라 공백 4칸","타깃 이름이 틀림","세미콜론이 빠짐"],"a":1,"w":"Makefile 규칙의 명령 줄은 반드시 탭 문자로 시작해야 합니다. 에디터가 탭을 공백으로 바꾸도록 설정돼 있으면 이 에러가 납니다.","an":"3교시 예제 3-3"},{"p":"Makefile 규칙 <code>app: main.o sensor.o<\/code> 에서 콜론 뒤에 나열된 main.o sensor.o 는 무엇을 뜻합니까?","c":"","o":["app 이 만들어 내는 파일","app 을 만드는 데 필요한 의존 파일","실행할 명령","변수 목록"],"a":1,"w":"\"타깃: 의존파일\" 형식입니다. 의존 파일 중 하나라도 타깃보다 새로우면 그 아래 명령을 다시 실행합니다.","an":"3교시 예제 3-3"},{"p":"make 를 한 번 실행한 뒤 아무 파일도 고치지 않고 make 를 다시 실행했습니다. 무슨 일이 일어납니까?","c":"$ make\ngcc -Wall -Wextra -O2 -c main.c\ngcc -Wall -Wextra -O2 -c sensor.c\ngcc -Wall -Wextra -O2 -o app main.o sensor.o\n$ make\n?","o":["전부 다시 컴파일한다","\"app is up to date\" 라고 하고 아무것도 하지 않는다","에러가 난다","clean 이 실행된다"],"a":1,"w":"make 는 파일의 수정 시각을 비교해 필요한 것만 다시 만듭니다. 바뀐 파일이 없으면 할 일이 없습니다.","an":"3교시 예제 3-3"},{"p":"아래 Makefile 에서 sensor.h 만 수정하고 make 를 실행하면 어떤 파일이 다시 컴파일됩니까?","c":"main.o: main.c sensor.h\n\tgcc -c main.c\nsensor.o: sensor.c sensor.h\n\tgcc -c sensor.c","o":["main.o 만","sensor.o 만","main.o 와 sensor.o 둘 다","아무것도 다시 컴파일되지 않는다"],"a":2,"w":"두 규칙 모두 sensor.h 를 의존성에 적어 두었으므로 둘 다 다시 만듭니다. 헤더를 의존성에 적지 않으면 오래된 .o 가 그대로 링크되어 \"분명 고쳤는데 안 바뀌는\" 버그가 됩니다.","an":"3교시 예제 3-3"},{"p":"Makefile 안의 <code>$(CC) $(CFLAGS) -c main.c<\/code> 에서 <code>$(CC)<\/code> 는 무엇입니까?","c":"CC     = gcc\nCFLAGS = -Wall -Wextra -O2","o":["명령을 실행하라는 뜻","Makefile 변수 CC 의 값(gcc)으로 치환된다","쉘 환경 변수","주석"],"a":1,"w":"Makefile 변수는 $(이름) 으로 참조합니다. 컴파일러나 옵션을 한 곳에서 바꿀 수 있게 해 줍니다.","an":"3교시 예제 3-3"},{"p":"main.c 에 아래 줄을 넣고 -Wall 로 컴파일하면 어떤 경고가 나옵니까?","c":"int unused = 1;   // 어디서도 쓰지 않음","o":["syntax error","warning: unused variable 'unused'","undefined reference","경고 없음"],"a":1,"w":"-Wall 은 선언만 하고 쓰지 않은 변수를 경고합니다. 파일:줄:열 — 경고 내용 — [옵션 이름] 형식을 읽는 연습을 하세요.","an":"3교시 예제 3-4"}]},{"t":"4교시 · 자료형과 메모리 표현","anim":"D1-3 메모리 바이트 뷰어 / D1-4 2의 보수 다이얼","qs":[{"p":"x86-64 Linux 에서 아래 두 값은 각각 얼마입니까?","c":"printf(\"%zu %zu\\n\", sizeof(int), sizeof(long));","o":["4 4","4 8","8 8","2 4"],"a":1,"w":"64비트 Linux 에서 int 는 4바이트, long 은 8바이트입니다. Windows 에서는 long 도 4라서 플랫폼마다 다릅니다.","an":"4교시 예제 4-1"},{"p":"임베디드 코드에서 int, long 대신 <code>uint8_t<\/code>, <code>int32_t<\/code> 같은 stdint.h 타입을 쓰는 가장 큰 이유는 무엇입니까?","c":"#include &lt;stdint.h&gt;\nuint16_t distance_mm;   // 0~4000\nint8_t   temp_c;        // -40~125","o":["연산이 더 빠르다","플랫폼과 무관하게 크기가 고정된다","이름이 짧다","부동소수점을 지원한다"],"a":1,"w":"레지스터·통신 프로토콜은 비트 폭이 정해져 있습니다. int 의 크기가 CPU 마다 다르면 프레임 구조가 깨지므로 고정폭 타입이 필요합니다.","an":"D1-3 · 자료형 선택"},{"p":"아래 코드를 실행한 뒤 a 의 값은 얼마입니까?","c":"uint8_t a = 250;\na += 10;","o":["260","4","255","컴파일 에러"],"a":1,"w":"8비트는 0~255 만 담습니다. 260 은 256 을 넘어가므로 260 − 256 = 4 로 감깁니다(wrap-around).","an":"D1-3 · 300 → uint8_t"},{"p":"아래 코드를 실행한 뒤 b 의 값은 (대부분의 환경에서) 얼마입니까?","c":"int8_t b = 127;\nb++;","o":["128","-128","0","127 그대로"],"a":1,"w":"01111111 + 1 = 10000000 이고, 이 비트를 signed 로 읽으면 −128 입니다. 엄밀히는 signed 오버플로가 정의되지 않은 동작이라 실제 코드에서 의존하면 안 됩니다.","an":"D1-4 · 127 → 128"},{"p":"8비트 값 11111111 을 unsigned char 로 읽으면 255 입니다. 같은 비트를 signed char(2의 보수)로 읽으면 얼마입니까?","c":"","o":["255","-1","-127","127"],"a":1,"w":"2의 보수에서 최상위 비트가 1이면 값은 (unsigned 값 − 256) 입니다. 255 − 256 = −1.","an":"D1-4 · 슬라이더 255"},{"p":"아래 코드에서 c 에 저장되는 값은 얼마입니까?","c":"int x = 300;            // 0x0000012C\nunsigned char c = x;","o":["300","44","255","0"],"a":1,"w":"300 = 0x12C 입니다. 1바이트에는 하위 바이트 0x2C 만 남고, 0x2C = 44 입니다.","an":"D1-3"},{"p":"\"리틀 엔디안\"이란 무엇을 뜻합니까?","c":"","o":["큰 자리 숫자부터 저장한다","가장 낮은 주소에 가장 낮은 바이트(LSB)를 저장한다","비트 순서를 거꾸로 저장한다","음수를 표현하는 방법이다"],"a":1,"w":"x86 과 ARM 의 기본 방식입니다. 그래서 메모리 덤프에서 숫자가 뒤집혀 보이고, 네트워크 바이트 순서(빅 엔디안)와 반대라 통신 코드에서 항상 확인해야 합니다.","an":"D1-3 · 엔디안 토글"},{"p":"리틀 엔디안 CPU 에서 아래 코드의 출력은 무엇입니까?","c":"int v = 0x11223344;\nunsigned char *p = (unsigned char *)&amp;v;\nprintf(\"%02X %02X %02X %02X\\n\", p[0], p[1], p[2], p[3]);","o":["11 22 33 44","44 33 22 11","22 11 44 33","33 44 11 22"],"a":1,"w":"낮은 주소 p[0] 부터 가장 낮은 바이트 0x44 가 옵니다.","an":"4교시 예제 4-2"},{"p":"signed char 가 표현할 수 있는 값의 범위는 무엇입니까?","c":"","o":["0 ~ 255","-128 ~ 127","-127 ~ 127","-256 ~ 255"],"a":1,"w":"8비트 2의 보수는 음수 128개, 0, 양수 127개로 총 256가지를 표현합니다. 그래서 −128 은 있지만 +128 은 없습니다.","an":"D1-4"},{"p":"x86-64 에서 <code>sizeof(int *)<\/code> 가 8 인 이유는 무엇입니까?","c":"","o":["int 가 8바이트라서","64비트 주소를 담아야 해서","포인터는 언제나 8바이트라서","컴파일러 버그"],"a":1,"w":"포인터의 크기는 가리키는 타입이 아니라 주소의 폭에 따릅니다. 32비트 MCU(ESP32)에서는 4바이트입니다.","an":"Day 2 예고"}]},{"t":"5교시 · 형변환·오버플로·실수 정밀도","anim":"D1-5 정수 승격 함정","qs":[{"p":"아래 코드의 출력은 무엇입니까?","c":"printf(\"%d\\n\", -1 &lt; 1u);","o":["1 (참)","0 (거짓)","컴파일 에러","정의되지 않음"],"a":1,"w":"int 와 unsigned int 를 비교하면 int 쪽이 unsigned 로 변환됩니다. −1 이 4294967295 가 되어 1 보다 커집니다.","an":"D1-5 · -1 &lt; 1u"},{"p":"위 비교에서 −1 이 unsigned int 로 변환되면 어떤 값이 됩니까?","c":"printf(\"%u\\n\", (unsigned)-1);","o":["1","0","4294967295","2147483647"],"a":2,"w":"−1 의 비트 패턴 0xFFFFFFFF 를 부호 없는 32비트로 읽은 값입니다.","an":"D1-5 · 4294967295"},{"p":"아래 비교가 거짓(0)이 되는 이유는 무엇입니까?","c":"printf(\"%d\\n\", -1 &lt; sizeof(int));   // 0","o":["sizeof(int) 가 0 이라서","sizeof 의 결과 타입이 size_t(unsigned)라서 −1 이 거대한 양수로 변환되기 때문","int 가 8바이트라서","컴파일러 버그"],"a":1,"w":"size_t 는 unsigned long 입니다. 배열 길이와 음수 인덱스를 비교하는 코드가 이 함정에 자주 빠지며, -Wsign-compare 경고로 잡힙니다.","an":"D1-5 · sizeof"},{"p":"아래 비교가 거짓인 이유는 무엇입니까?","c":"double a = 0.1 + 0.2;\nprintf(\"%d\\n\", a == 0.3);      // 0\nprintf(\"%.20f\\n\", a);          // 0.30000000000000004441","o":["덧셈 버그","이진 부동소수점이 0.1 을 정확히 표현하지 못하기 때문","== 는 실수에 쓸 수 없어서","0.3 이 상수가 아니라서"],"a":1,"w":"실수는 fabs(a − b) &lt; 아주 작은 값 처럼 오차 범위로 비교해야 합니다.","an":"5교시 예제 5-4"},{"p":"아래 식의 값은 얼마입니까?","c":"7 / 2","o":["3.5","3","4","3.0"],"a":1,"w":"정수끼리 나누면 소수점을 버리는 정수 나눗셈입니다. 3.5 를 얻으려면 7 / 2.0 처럼 한쪽을 실수로 만들어야 합니다.","an":"5교시 예제 5-3"},{"p":"섭씨를 화씨로 바꾸는 아래 코드에서 f 의 값은 얼마입니까?","c":"int c = 26;\ndouble f = c * 9 / 5 + 32;","o":["78.8","78.0","79.0","78.4"],"a":1,"w":"왼쪽부터 정수로 계산됩니다. c*9 = 234, 234/5 = 46(정수 나눗셈), 46+32 = 78. double 변수에 넣어도 이미 잘린 뒤입니다.","an":"5교시 예제 5-3"},{"p":"위 코드의 정수 나눗셈 문제를 고치는 가장 간단한 방법은 무엇입니까?","c":"","o":["double 을 float 로 바꾼다","c * 9.0 / 5 + 32 로 쓴다","(double)(c * 9 / 5) + 32 로 쓴다","c / 5 * 9 로 순서를 바꾼다"],"a":1,"w":"피연산자 하나만 실수여도 그 연산부터 실수로 계산됩니다. ③은 이미 잘린 정수를 뒤늦게 변환하므로 틀립니다.","an":"5교시 예제 5-3"},{"p":"아래 식 <code>c + 1<\/code> 의 타입은 무엇입니까?","c":"char c = 'A';\nprintf(\"%zu\\n\", sizeof(c + 1));","o":["char (1)","int (4)","short (2)","unsigned char (1)"],"a":1,"w":"int 보다 작은 정수형은 연산에 들어가는 순간 int 로 정수 승격됩니다. 그래서 sizeof(c + 1) 은 4 입니다.","an":"5교시 예제 5-2"},{"p":"아래 캐스팅의 결과는 얼마입니까?","c":"(int)3.99","o":["4","3","3.99","컴파일 에러"],"a":1,"w":"실수를 정수로 캐스팅하면 소수부를 버립니다(반올림이 아님). 반올림이 필요하면 round() 를 씁니다.","an":"5교시 예제 5-4"},{"p":"signed 와 unsigned 를 섞어 비교할 때 컴파일러가 경고해 주게 하려면 어떤 옵션이 필요합니까?","c":"","o":["-O2","-Wsign-compare (또는 이를 포함하는 -Wextra)","-g","-std=c99"],"a":1,"w":"-Wall -Wextra 를 켜면 오늘 본 함정 대부분이 경고로 잡힙니다. 경고를 읽는 습관이 가장 싼 디버깅입니다.","an":"D1-5"}]},{"t":"6교시 · 연산자와 제어문","anim":"D1-6 switch fall-through","qs":[{"p":"switch 문에서 case 끝에 break 를 쓰지 않으면 어떻게 됩니까?","c":"","o":["컴파일 에러가 난다","그 case 만 실행되고 switch 를 빠져나온다","다음 case 의 코드까지 이어서 실행된다(fall-through)","default 로 점프한다"],"a":2,"w":"case 는 블록이 아니라 점프 목적지입니다. break 라는 벽을 만날 때까지 아래로 계속 실행됩니다.","an":"D1-6"},{"p":"아래 코드의 출력은 무엇입니까?","c":"int n = 2;\nswitch (n) {\n    case 1:  printf(\"one \");\n    case 2:  printf(\"two \");\n    case 3:  printf(\"three \"); break;\n    case 4:  printf(\"four \");\n    default: printf(\"other \");\n}","o":["two","two three","three","two three four other"],"a":1,"w":"case 2 로 진입한 뒤 break 가 없어 case 3 까지 실행되고, 거기서 break 를 만나 멈춥니다.","an":"D1-6 · n=2 실행"},{"p":"아래 if 문의 문제는 무엇입니까?","c":"int x = 0;\nif (x = 5) printf(\"A\\n\");","o":["문법 에러","대입이라 x 가 5 가 되고 조건은 항상 참이 된다","x 가 0 이 된다","비교가 되지 않아 아무것도 출력되지 않는다"],"a":1,"w":"= 는 대입, == 가 비교입니다. -Wall 이 \"suggest parentheses around assignment\" 경고를 냅니다. 상수를 왼쪽에 쓰는 습관(5 == x)이면 실수가 컴파일 에러가 됩니다.","an":"6교시 예제 6-1"},{"p":"a = 2, b = 4 일 때 아래 두 식의 값은 각각 무엇입니까?","c":"a &amp; b     // ?\na &amp;&amp; b    // ?","o":["둘 다 1","&amp; 는 0, &amp;&amp; 는 1","둘 다 0","&amp; 는 6, &amp;&amp; 는 1"],"a":1,"w":"&amp; 는 비트 AND 입니다. 010 &amp; 100 = 000 이라 0. &amp;&amp; 는 논리 AND 라 둘 다 0 이 아니므로 1.","an":"6교시 예제 6-1"},{"p":"아래 식의 값은 얼마입니까?","c":"1 &lt;&lt; 3 + 1","o":["9","16","7","4"],"a":1,"w":"+ 가 &lt;&lt; 보다 우선순위가 높아 1 &lt;&lt; 4 = 16 이 됩니다. 시프트 식에는 항상 괄호를 붙이세요: (1 &lt;&lt; 3) + 1 = 9.","an":"6교시 예제 6-1"},{"p":"아래 조건이 참이면 x 는 어떤 수입니까?","c":"if (x % 2 == 0)","o":["홀수","짝수","0 만","음수"],"a":1,"w":"% 는 나머지 연산자입니다. 2 로 나눈 나머지가 0 이면 짝수입니다.","an":"6교시"},{"p":"메뉴 입력처럼 \"일단 한 번은 실행하고 조건을 검사\"하는 반복이 필요합니다. 어떤 반복문이 알맞습니까?","c":"____ {\n    printf(\"1) 측정  2) 저장  0) 종료 &gt; \");\n    scanf(\"%d\", &amp;sel);\n} while (sel != 0);","o":["for","while","do-while","switch"],"a":2,"w":"do-while 은 본문을 먼저 실행한 뒤 조건을 검사하므로 최소 한 번은 실행됩니다.","an":"6교시 빈칸 6-1"},{"p":"이중 for 루프 안쪽에서 break 를 만나면 어떻게 됩니까?","c":"for (i = 0; i &lt; 3; i++)\n    for (j = 0; j &lt; 3; j++)\n        if (j == 1) break;","o":["두 루프를 모두 빠져나온다","안쪽 j 루프 하나만 빠져나오고 i 루프는 계속된다","현재 반복만 건너뛴다","함수가 종료된다"],"a":1,"w":"break 는 가장 가까운 루프(또는 switch) 하나만 빠져나옵니다. 전체 탈출은 플래그 변수나 return 을 씁니다.","an":"6교시"},{"p":"반복문 안에서 continue 를 만나면 어떻게 됩니까?","c":"for (n = 2; n &lt;= 100; n++) {\n    if (!is_prime(n)) continue;\n    printf(\"%d \", n);\n}","o":["루프를 종료한다","이번 반복의 나머지(printf)를 건너뛰고 다음 반복으로 간다","조건을 다시 설정한다","switch 를 빠져나온다"],"a":1,"w":"for 에서는 증감식(n++)으로 바로 갑니다. 소수가 아니면 출력을 건너뛰는 용도입니다.","an":"6교시 예제 6-4"},{"p":"소수 판별에서 나눗셈 검사를 <code>i * i &lt;= n<\/code> 까지만 해도 되는 이유는 무엇입니까?","c":"for (int i = 2; i * i &lt;= n; i++)\n    if (n % i == 0) return 0;","o":["속도와 무관하게 C 규칙이라서","n 의 약수는 √n 을 기준으로 짝을 이루므로 그 범위에 약수가 없으면 소수이기 때문","i 가 int 라서","n 이 100 이하라서"],"a":1,"w":"n = a × b 이면 둘 중 하나는 반드시 √n 이하입니다. 그 범위에 약수가 없으면 더 볼 필요가 없습니다.","an":"6교시 예제 6-4"}]},{"t":"7교시 · 함수와 스코프","anim":"D1-7 스택 프레임","qs":[{"p":"아래 코드에서 inc(a) 를 호출한 뒤 main 의 a 는 얼마입니까?","c":"void inc(int x) { x++; }\n\nint main(void) {\n    int a = 5;\n    inc(a);\n    printf(\"%d\\n\", a);\n}","o":["6","5","0","컴파일 에러"],"a":1,"w":"C 는 값 전달(call by value)입니다. inc 안의 x 는 복사본이라 원본 a 는 바뀌지 않습니다. 원본을 바꾸려면 주소를 넘겨야 합니다(Day 2 포인터).","an":"7교시 예제 7-1"},{"p":"함수 원형(prototype)을 파일 위쪽에 미리 선언하는 이유는 무엇입니까?","c":"int fact(int n);         // 원형\n\nint main(void) { return fact(3); }\n\nint fact(int n) { ... }  // 정의는 아래에","o":["실행 속도 때문","호출 지점보다 뒤에 정의된 함수도 컴파일러가 인자·반환 타입을 알 수 있게 하기 위해","링크를 생략하기 위해","스택을 절약하기 위해"],"a":1,"w":"컴파일러는 위에서 아래로 읽습니다. 원형이 없으면 호출 시점에 타입을 검사할 수 없습니다.","an":"D1-2 · 선언 vs 정의"},{"p":"아래 재귀 함수에서 fact(3) 을 호출할 때, 동시에 스택에 존재하는 fact 프레임의 최대 개수는 몇 개입니까?","c":"int fact(int n) {\n    if (n &lt;= 1) return 1;\n    return n * fact(n - 1);\n}","o":["1","3","6","9"],"a":1,"w":"fact(3) → fact(2) → fact(1) 세 프레임이 쌓였다가 위에서부터 사라집니다.","an":"D1-7 · 프레임 3개"},{"p":"재귀 호출에서 스택 프레임이 사라지는(반환되는) 순서는 무엇입니까?","c":"","o":["먼저 호출된 것부터","가장 나중에 호출된 것(맨 위)부터","무작위","모두 동시에"],"a":1,"w":"스택은 LIFO 입니다. fact(1) 이 먼저 반환되고 값이 아래 프레임으로 전달됩니다.","an":"D1-7 · pop 순서"},{"p":"아래 함수 안의 static 변수 c 는 어떻게 동작합니까?","c":"int counter(void) {\n    static int c = 0;\n    return ++c;\n}","o":["호출할 때마다 0 으로 초기화된다","프로그램 시작 시 한 번만 초기화되고 호출 사이에 값이 유지된다","전역 변수와 완전히 같다","스택에 저장된다"],"a":1,"w":"static 지역 변수는 데이터 영역에 살며, 함수 밖에서는 보이지 않습니다. 호출 횟수 카운터나 이동평균 버퍼에 씁니다.","an":"D1-7 · 데이터 영역"},{"p":"파일 범위(함수 밖)에 쓴 아래 static 은 무엇을 뜻합니까?","c":"static int helper(void) { ... }","o":["값이 유지된다","이 함수가 이 파일 밖에서는 보이지 않는다(내부 연결)","상수 함수다","인라인 함수다"],"a":1,"w":"같은 static 이지만 함수나 전역 변수에 붙으면 \"이 파일 전용\"이라는 뜻입니다. 다른 .c 와 이름이 겹쳐도 충돌하지 않습니다.","an":"7교시 예제 7-3"},{"p":"아래 코드에서 세 번의 next_id() 호출 순서는 어떻게 정해집니까?","c":"int next_id(void) { static int id = 0; return ++id; }\n\nprintf(\"%d %d %d\\n\", next_id(), next_id(), next_id());","o":["항상 왼쪽부터","항상 오른쪽부터","C 표준이 정하지 않는다(컴파일러마다 다름)","동시에 평가된다"],"a":2,"w":"인자 평가 순서는 미지정입니다. gcc 는 보통 오른쪽부터 평가해 \"3 2 1\" 을 출력합니다. 부수효과가 있는 호출을 한 식에 여러 번 넣지 마세요.","an":"7교시 예제 7-4"},{"p":"아래처럼 매우 깊은 재귀를 호출하면 어떤 위험이 있습니까?","c":"depth(10000000);   // 천만 번 재귀","o":["위험 없음","프레임이 스택 한계를 넘어 세그폴트(스택 오버플로)가 난다","컴파일 에러","너무 빨라서 문제"],"a":1,"w":"프레임마다 스택 메모리를 씁니다. PC 는 8MB 정도지만 ESP32 태스크 스택은 수 KB 라 임베디드에서 더 위험합니다.","an":"7교시 예제 7-5"},{"p":"함수 안에서 선언한 지역 변수는 어디에 저장됩니까?","c":"int fact(int n) {\n    int r = n * fact(n - 1);   // r 은 어디에?\n    return r;\n}","o":["데이터 영역","힙","그 호출의 스택 프레임 안","레지스터에만"],"a":2,"w":"함수가 호출될 때 프레임과 함께 생기고, 반환되면 프레임과 함께 사라집니다.","an":"D1-7"},{"p":"반환값이 없는 함수의 반환형은 무엇으로 씁니까?","c":"____ print_reading(Reading r) {\n    printf(...);\n}","o":["null","void","int 0","생략한다"],"a":1,"w":"void 함수는 값 없이 return; 만 쓸 수 있습니다. 참고로 main 은 종료 코드를 위해 int 를 반환해야 합니다.","an":"7교시"}]},{"t":"8교시 · 종합 (숫자 야구 설계)","anim":"D1-8 숫자 야구 흐름","qs":[{"p":"난수 시드를 설정하는 아래 호출은 프로그램에서 몇 번 해야 합니까?","c":"srand((unsigned)time(NULL));","o":["난수를 뽑을 때마다","프로그램 시작 시 한 번","매 턴마다","호출하지 않아도 된다"],"a":1,"w":"같은 초 안에서 여러 번 부르면 시드가 같아져 같은 난수가 나옵니다. main 첫머리에서 한 번만 호출합니다.","an":"D1-8 · gen_answer"},{"p":"아래 식이 만들어 내는 값의 범위는 무엇입니까?","c":"rand() % 10","o":["1 ~ 10","0 ~ 9","0 ~ 10","1 ~ 9"],"a":1,"w":"나머지는 0 부터 9 까지입니다. 1~9 가 필요하면 rand() % 9 + 1 로 씁니다.","an":"8교시"},{"p":"정답 세 자리 숫자를 담기에 가장 알맞은 변수 선언은 무엇입니까?","c":"","o":["int a, b, c;","int ans[3];","char *ans;","double ans;"],"a":1,"w":"같은 성격의 값 여러 개는 배열로 두면 판정에서 for 로 돌릴 수 있습니다.","an":"D1-8"},{"p":"입력 검증 함수 is_valid() 가 확인할 항목이 아닌 것은 무엇입니까?","c":"int is_valid(const int g[3]);","o":["각 값이 0~9 인지","세 값이 서로 다른지","정답과 같은지","(모두 확인해야 한다)"],"a":2,"w":"정답과 비교하는 것은 judge() 의 일입니다. 함수 하나는 한 가지 책임만 갖도록 나눕니다.","an":"D1-8 · is_valid"},{"p":"아래 judge() 뼈대에서 strike 로 세어야 하는 조건은 무엇입니까?","c":"for (int i = 0; i &lt; 3; i++)\n    for (int j = 0; j &lt; 3; j++)\n        if (ans[i] == g[j]) {\n            if (____) strike++;\n            else      ball++;\n        }","o":["ans[i] != g[j]","i == j (자리까지 같음)","i != j","ans[i] &gt; g[j]"],"a":1,"w":"숫자가 같고 자리(i == j)까지 같으면 strike, 숫자만 같고 자리가 다르면 ball 입니다.","an":"D1-8 · judge"},{"p":"judge() 가 strike 와 ball 두 값을 모두 돌려줘야 합니다. C 에서 흔히 쓰는 방법은 무엇입니까?","c":"void judge(const int ans[3], const int g[3], int *strike, int *ball);","o":["return 을 두 번 쓴다","포인터 인자(int *)로 주소를 받아 그 자리에 써 준다","전역 변수만 쓴다","불가능하다"],"a":1,"w":"main 에서 judge(ans, g, &amp;s, &amp;b) 처럼 변수의 주소를 넘기면 함수가 그 자리에 값을 써 줍니다. Day 2 포인터의 첫 번째 활용입니다.","an":"Day 2 예고"},{"p":"사용자가 \"abc\" 를 입력했을 때 프로그램이 죽거나 무한 루프에 빠지지 않게 하려면 어떻게 해야 합니까?","c":"if (scanf(\"%d %d %d\", &amp;g[0], &amp;g[1], &amp;g[2]) != 3) {\n    ____\n    return 0;\n}","o":["scanf 반환값을 무시한다","입력 버퍼에 남은 문자를 비우고(getchar 반복) 다시 묻는다","exit() 로 종료한다","입력을 받지 않는다"],"a":1,"w":"scanf 가 3 을 반환하지 않으면 실패입니다. 남은 문자를 비우지 않으면 다음 scanf 가 같은 문자에서 또 실패해 무한 루프가 됩니다.","an":"D1-8 · 재입력 루프"},{"p":"게임 루프를 끝내는 조건은 무엇입니까?","c":"while (1) {\n    ...\n    judge(ans, g, &amp;s, &amp;b);\n    print_result(s, b, tries);\n    if (____) break;\n}","o":["b == 3","s == 3","s + b == 3","tries == 10"],"a":1,"w":"3 strike 면 정답입니다. 시도 횟수를 출력하고 종료합니다.","an":"D1-8 · print_result"},{"p":"과제를 main.c / game.c / game.h 세 파일로 나누라고 하는 이유로 알맞은 것은 무엇입니까?","c":"","o":["컴파일이 빨라지기 때문만","책임을 분리하고 재사용할 수 있으며 Makefile 이 바뀐 파일만 다시 만들 수 있기 때문","C 문법 규칙이라서","main 이 짧아야 해서"],"a":1,"w":"game.c 는 다른 프로젝트에서도 쓸 수 있고, 헤더로 인터페이스가 드러나며, 한 파일만 고치면 그 파일만 재컴파일됩니다.","an":"3교시 · Makefile"},{"p":"제출 조건으로 \"-Wall -Wextra 경고 0 개\"를 요구하는 이유는 무엇입니까?","c":"$ make clean &amp;&amp; make\n(경고가 하나도 없어야 통과)","o":["형식적인 조건","경고 대부분이 실제 버그(미초기화, 부호 비교, = / == 등)의 신호이기 때문","실행 속도를 위해","채점 프로그램이 경고를 못 읽어서"],"a":1,"w":"오늘 본 함정들(=, signed/unsigned 비교, unused, fall-through)은 전부 경고로 잡힙니다. 경고 0 개는 그 함정을 다 피했다는 뜻입니다.","an":"5교시 · 6교시"}]}];
const MARK=['1','2','3','4'];
const NOTE_KEY='c-day1-quiz-wrong';
const $=s=>document.querySelector(s);

function loadNote(){try{return new Set(JSON.parse(localStorage.getItem(NOTE_KEY)||'[]'))}catch(e){return new Set()}}
function saveNote(){try{localStorage.setItem(NOTE_KEY,JSON.stringify([...note]))}catch(e){}}
let note=loadNote();

const sel=new Set(Q.map((_,i)=>i));
let deck=[],idx=0,mode='range';

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function qid(s,k){return `Q${s+1}-${k+1}`}

function build(items){
  const so=$('#shufO').checked;
  deck=items.map(([s,k])=>({s,k,order:so?shuffle([0,1,2,3]):[0,1,2,3],pick:null}));
  if($('#shufQ').checked) shuffle(deck);
  idx=0;
}
function startRange(){
  mode='range';
  const items=[];[...sel].sort((a,b)=>a-b).forEach(s=>Q[s].qs.forEach((_,k)=>items.push([s,k])));
  build(items);render();
}
function startNote(){
  const items=[...note].map(x=>x.split('-').map(Number)).filter(([s,k])=>Q[s]&&Q[s].qs[k]);
  if(!items.length)return;
  mode='note';build(items);render();
}
function startItems(items,m){mode=m;build(items);render()}

function renderChips(){
  $('#chips').innerHTML=Q.map((s,i)=>`<button class="chip" aria-pressed="${sel.has(i)}" data-i="${i}" title="${s.t}">${i+1}교시</button>`).join('')+
    `<button class="chip" id="allChip" aria-pressed="${sel.size===Q.length}">전체</button>`;
  $('#chips').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);renderChips()});
  $('#allChip').onclick=()=>{if(sel.size===Q.length)sel.clear();else Q.forEach((_,i)=>sel.add(i));renderChips()};
  $('#startBtn').disabled=sel.size===0;
  $('#startBtn').textContent=sel.size?`이 범위로 새로 시작 (${sel.size*10}문항)`:'교시를 하나 이상 고르세요';
}
function renderNoteBtn(){
  $('#noteBtn').textContent=`오답노트 풀기 (${note.size})`;
  $('#noteBtn').disabled=note.size===0;$('#clearNoteBtn').disabled=note.size===0;
}

function counts(){let ok=0,bad=0;deck.forEach(d=>{if(d.pick===null)return;Q[d.s].qs[d.k].a===d.pick?ok++:bad++});return{ok,bad,done:ok+bad}}
function renderStatus(){
  const {ok,bad,done}=counts(),n=deck.length;
  $('#statL').innerHTML=`[ <b>${String(done).padStart(String(n).length,' ')}/${n}</b> ] ${mode==='note'?'오답노트':mode==='retry'?'틀린 문제 다시':'출제 범위'}`;
  $('#statR').innerHTML=`맞힘 <b>${ok}</b> · 틀림 <b>${bad}</b>${done?` · 정답률 <b>${Math.round(ok/done*100)}%</b>`:''}`;
  $('#barG').style.width=n?ok/n*100+'%':'0';$('#barR').style.width=n?bad/n*100+'%':'0';
}

function render(){
  renderNoteBtn();renderStatus();
  if(idx>=deck.length){renderResult();return}
  const d=deck[idx],sec=Q[d.s],q=sec.qs[d.k],done=d.pick!==null;
  const opts=d.order.map((oi,pos)=>{
    let cls='';if(done){if(oi===q.a)cls='ok';else if(oi===d.pick)cls='bad'}
    return `<button class="opt ${cls}" data-o="${oi}" ${done?'disabled':''}><span class="k">${MARK[pos]}</span><span>${q.o[oi]}</span></button>`}).join('');
  const right=done&&d.pick===q.a;
  $('#stage').innerHTML=`<article class="card">
    <div class="qmeta"><span><span class="id">${qid(d.s,d.k)}</span> · ${sec.t}</span><span>${idx+1} / ${deck.length}</span></div>
    <p class="prompt">${q.p}</p>
    ${q.c?`<pre class="qc">${q.c}</pre>`:''}
    <div class="opts">${opts}</div>
    ${done?`<div class="fb ${right?'':'bad'}"><span class="v ${right?'ok-t':'bad-t'}">${right?'정답입니다.':'오답입니다.'}</span>${q.w}<span class="src">강의 확인: ${q.an} · 🎬 ${sec.anim}</span></div>`:''}
    <div class="nav">
      <button class="btn" id="prevBtn" ${idx===0?'disabled':''}>이전</button>
      <span class="hint">키보드: 1–4 선택 · Enter 다음 · ← 이전</span>
      <button class="btn primary" id="nextBtn" ${done?'':'disabled'}>${idx===deck.length-1?'결과 보기':'다음 문제'}</button>
    </div></article>`;
  $('#stage').querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.o));
  $('#prevBtn').onclick=prev;$('#nextBtn').onclick=next;
}
function choose(oi){
  const d=deck[idx];if(d.pick!==null)return;d.pick=oi;
  const id=`${d.s}-${d.k}`;
  if(oi===Q[d.s].qs[d.k].a)note.delete(id);else note.add(id);
  saveNote();render();
}
function next(){if(deck[idx]&&deck[idx].pick!==null){idx++;render();window.scrollTo({top:0})}}
function prev(){if(idx>0){idx--;render()}}

function strip(h){const e=document.createElement('div');e.innerHTML=h;return e.textContent}
function renderResult(){
  const {ok,bad}=counts(),n=deck.length,skip=n-ok-bad;
  const per={};deck.forEach(d=>{const p=per[d.s]||(per[d.s]={n:0,ok:0});p.n++;if(d.pick===Q[d.s].qs[d.k].a)p.ok++});
  const wrong=deck.filter(d=>d.pick!==Q[d.s].qs[d.k].a).sort((a,b)=>a.s-b.s||a.k-b.k);
  const log=`$ make quiz\n`+Object.keys(per).map(Number).sort((a,b)=>a-b).map(s=>{const p=per[s],miss=p.n-p.ok;
    return `${Q[s].t.split(' · ')[0]}.c: ${miss?`<span class="w">${miss} warning${miss>1?'s':''}</span>`:'<span class="o">ok</span>'} (${p.ok}/${p.n})`}).join('\n')+
    `\n${bad+skip?`<span class="e">quiz: ${bad+skip}개 틀림</span> · `:'<span class="o">경고 0개 — 제출 조건 통과</span> · '}${ok}/${n} 맞힘 (${Math.round(ok/n*100)}%)`;
  $('#stage').innerHTML=`<article class="card result">
    <h2>결과 ${ok} / ${n}</h2>
    <pre class="log">${log}</pre>
    <div class="btns">
      ${wrong.length?`<button class="btn primary" id="retryBtn">틀린 ${wrong.length}문제 다시 풀기</button>`:''}
      <button class="btn" id="againBtn">같은 범위 처음부터</button>
    </div>
    <div class="label">틀린 문제 정리</div>
    <div class="wrong">${wrong.length?wrong.map(d=>{const q=Q[d.s].qs[d.k];
      return `<div class="witem"><span class="id">${qid(d.s,d.k)}</span><div>${q.p}</div>
        <div class="my">내 답: ${d.pick===null?'미응답':q.o[d.pick]}</div>
        <div class="co">정답: ${q.o[q.a]}</div><div class="ex">${q.w}</div></div>`}).join(''):'<p class="empty">틀린 문제가 없습니다.</p>'}</div>
  </article>`;
  const r=$('#retryBtn');if(r)r.onclick=()=>startItems(wrong.map(d=>[d.s,d.k]),'retry');
  $('#againBtn').onclick=()=>startItems(deck.map(d=>[d.s,d.k]),mode);
}

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  if(idx>=deck.length)return;
  if(/^[1-4]$/.test(e.key)){const b=$('#stage').querySelectorAll('.opt')[+e.key-1];if(b&&!b.disabled)b.click()}
  else if(e.key==='Enter'){if(document.activeElement&&document.activeElement.tagName==='BUTTON')return;next()}
  else if(e.key==='ArrowLeft')prev();
});
$('#startBtn').onclick=startRange;$('#noteBtn').onclick=startNote;
$('#clearNoteBtn').onclick=()=>{note.clear();saveNote();renderNoteBtn()};

renderChips();startRange();
</script>

</body>
