<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Day 2 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow study column — setup strip, a make-style progress line, one question card at a time */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#17202b; --dim:#5b6878; --line:#d9dfe6;
  --accent:#0f6f8a; --accent-ink:#ffffff; --accent-soft:#e1f0f4;
  --ok:#1d7a3e; --ok-soft:#e3f3e8; --bad:#b4232f; --bad-soft:#fbe7e8; --warn:#9a5b00;
  --code-bg:#eef1f4;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#151d27; --fg:#dde5ee; --dim:#8d9aab; --line:#263243;
  --accent:#4fb8d4; --accent-ink:#06222b; --accent-soft:#12303a;
  --ok:#58c98a; --ok-soft:#12301f; --bad:#f07a83; --bad-soft:#3a1519; --warn:#e8b04f;
  --code-bg:#0b1118; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#151d27; --fg:#dde5ee; --dim:#8d9aab; --line:#263243;
  --accent:#4fb8d4; --accent-ink:#06222b; --accent-soft:#12303a;
  --ok:#58c98a; --ok-soft:#12301f; --bad:#f07a83; --bad-soft:#3a1519; --warn:#e8b04f;
  --code-bg:#0b1118; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:flex;flex-direction:column;gap:18px}
header h1{font-size:1.65rem;margin:0;text-wrap:balance;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--dim);font-size:.92rem}
code,pre,.mono{font-family:var(--f-mono)}
code{background:var(--code-bg);padding:1px 5px;border-radius:4px;font-size:.88em}

.setup{display:flex;flex-direction:column;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:4px 12px;font:inherit;font-size:.86rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.row label{display:flex;gap:6px;align-items:center;font-size:.9rem;cursor:pointer}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:.9rem;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.status{display:flex;flex-direction:column;gap:6px}
.statline{font-family:var(--f-mono);font-size:.82rem;color:var(--dim);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.statline b{color:var(--fg);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)} .bar .r{background:var(--bad)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.qmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--dim)}
.qmeta .id{font-family:var(--f-mono);color:var(--accent);font-weight:600}
.prompt{font-size:1.06rem;font-weight:500;margin:0}
pre.qc{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;font-size:.86rem;line-height:1.55;white-space:pre}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;font-size:.95rem;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);cursor:pointer;min-width:0}
.opt .k{font-family:var(--f-mono);font-size:.8rem;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 6px;line-height:1.6;flex:none}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{border-color:var(--ok);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{border-color:var(--bad);color:var(--bad)}
.fb{border-left:3px solid var(--ok);background:var(--ok-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.92rem}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb .v{font-weight:700;margin-right:4px}
.fb .ok-t{color:var(--ok)} .fb .bad-t{color:var(--bad)}
.fb .src{display:block;margin-top:4px;font-size:.8rem;color:var(--dim)}
.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hint{font-size:.78rem;color:var(--dim)}

.result h2{margin:0;font-size:1.3rem}
.log{font-family:var(--f-mono);font-size:.85rem;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre;margin:0}
.log .w{color:var(--warn)} .log .e{color:var(--bad)} .log .o{color:var(--ok)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
td.n{text-align:right;font-family:var(--f-mono)}
.wrong{display:flex;flex-direction:column;gap:10px}
.witem{border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:.9rem;display:flex;flex-direction:column;gap:4px;min-width:0}
.witem .id{font-family:var(--f-mono);color:var(--accent);font-size:.8rem;font-weight:600}
.witem .my{color:var(--bad)} .witem .co{color:var(--ok);font-weight:600}
.witem .ex{color:var(--dim);font-size:.85rem}
.empty{color:var(--dim);font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.btn{transition:background-color .12s,border-color .12s}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>C Day 2 퀴즈</h1>
    <p>포인터·배열·문자열·동적 메모리 · 개념 워크시트 80문항 (8교시 × 10). 보기를 고르면 바로 채점되고 해설이 나옵니다.</p>
  </header>

  <section class="setup" aria-label="출제 설정">
    <div>
      <div class="label">출제 범위</div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="row">
      <label><input type="checkbox" id="shufQ" checked> 문제 순서 섞기</label>
      <label><input type="checkbox" id="shufO" checked> 보기 순서 섞기</label>
    </div>
    <div class="btns">
      <button class="btn primary" id="startBtn">이 범위로 새로 시작</button>
      <button class="btn" id="noteBtn">오답노트 풀기</button>
      <button class="btn" id="clearNoteBtn">오답노트 비우기</button>
    </div>
  </section>

  <section class="status" aria-live="polite">
    <div class="statline"><span id="statL"></span><span id="statR"></span></div>
    <div class="bar"><i class="g" id="barG"></i><i class="r" id="barR"></i></div>
  </section>

  <main id="stage"></main>
</div>

<script>
const Q=[{"t":"1교시 · 포인터 기초","anim":"D2-1 포인터 화살표 뷰어","qs":[{"p":"아래 코드에서 p 에 저장되는 것은 무엇입니까?","c":"int x = 5;\nint *p = &amp;x;","o":["x 의 값 5","x 의 주소","x 의 복사본","0"],"a":1,"w":"&amp; 는 주소 연산자입니다. p 는 x 가 있는 메모리 주소를 담고, *p 로 그 주소의 값에 접근합니다.","an":"D2-1"},{"p":"이어서 아래 두 줄을 실행하면 x 는 얼마가 됩니까?","c":"*p = 42;\nprintf(\"%d\\n\", x);","o":["5","42","주소값","컴파일 에러"],"a":1,"w":"*p 는 \"p 가 가리키는 곳\"이고 그곳이 바로 x 입니다. 화살표를 따라가 값을 쓴 것입니다.","an":"D2-1 · *p = 42"},{"p":"64비트 Linux 에서 아래 두 값은 각각 얼마입니까?","c":"int *p;\nprintf(\"%zu %zu\\n\", sizeof(p), sizeof(*p));","o":["4 4","8 4","4 8","8 8"],"a":1,"w":"p 자체는 8바이트 주소, *p 는 int 이므로 4바이트입니다. 어제 sizeof(int *) 가 8 이었던 이유입니다.","an":"1교시 예제 1-1"},{"p":"Day 1 의 inc(int x){ x++; } 는 원본을 바꾸지 못했습니다. 아래처럼 고치면 원본이 바뀌는 이유는 무엇입니까?","c":"void inc(int *p) { (*p)++; }\n\nint x = 5;\ninc(&amp;x);     // x → 6","o":["x 가 전역이 되어서","x 의 주소를 넘겨 함수가 그 자리에 직접 쓰기 때문","++ 가 두 번 적용돼서","포인터는 값을 복사하지 않아서"],"a":1,"w":"여전히 값 전달이지만 전달되는 값이 \"주소\"입니다. 함수는 그 주소를 따라가 호출자의 변수를 수정합니다.","an":"1교시 예제 1-2"},{"p":"아래 코드를 -Wall 로 컴파일하고 실행하면 어떻게 됩니까?","c":"int *p;      // 초기화 없음\n*p = 10;","o":["p 가 자동으로 새 메모리를 가리켜 정상 동작","경고 후 실행 시 대부분 Segmentation fault","컴파일 에러로 실행 불가","10 이 출력된다"],"a":1,"w":"선언만 된 포인터는 쓰레기 주소를 담고 있습니다. -Wuninitialized 경고가 나고, 그 주소에 쓰려다 죽습니다.","an":"1교시 예제 1-3 · D2-1 int *q"},{"p":"아래 코드에서 첫 번째 printf 가 출력하는 값과 그 직후 p 가 가리키는 곳은 무엇입니까?","c":"int arr[3] = {3, 1, 2};\nint *p = arr;\nprintf(\"%d\\n\", *p++);","o":["3 을 출력, p 는 arr[0] 그대로","3 을 출력, p 는 arr[1]","4 를 출력, p 는 arr[0]","1 을 출력, p 는 arr[1]"],"a":1,"w":"후위 ++ 가 * 보다 우선순위가 높아 *p++ 는 *(p++) 입니다. 현재 값을 쓴 뒤 포인터를 다음 칸으로 옮깁니다.","an":"1교시 예제 1-4"},{"p":"포인터가 가리키는 값을 1 증가시키려면 어떻게 써야 합니까?","c":"int x = 5;\nint *p = &amp;x;\n____;      // x 가 6 이 되도록","o":["*p++","p++","(*p)++","&amp;p++"],"a":2,"w":"괄호로 역참조를 먼저 하고 그 값을 증가시킵니다. 어제 숫자 야구 정답의 (*strike)++ 가 이 모양이었습니다.","an":"1교시 예제 1-4"},{"p":"NULL 로 초기화한 포인터의 장점은 무엇입니까?","c":"int *p = NULL;\nif (p == NULL) printf(\"아직 가리키는 곳 없음\\n\");","o":["역참조해도 안전하다","\"가리키는 곳이 없다\"를 검사할 수 있다","자동으로 메모리를 할당한다","값이 0 으로 읽힌다"],"a":1,"w":"NULL 을 역참조해도 죽는 것은 같지만, 쓰레기 값과 달리 if (p == NULL) 로 상태를 알 수 있습니다.","an":"D2-1 · p = NULL"},{"p":"아래 swap 이 동작하려면 호출을 어떻게 해야 합니까?","c":"void swap(int *a, int *b) { int t = *a; *a = *b; *b = t; }\n\nint x = 5, y = 9;\nswap(____);","o":["x, y","&amp;x, &amp;y","*x, *y","x, &amp;y"],"a":1,"w":"매개변수가 int * 이므로 주소를 넘깁니다. swap(x, y) 는 타입 불일치로 컴파일 에러입니다.","an":"1교시 예제 1-2"},{"p":"아래 함수처럼 \"반환값은 성공 여부, 결과는 포인터로\" 돌려주는 방식을 쓰는 C 표준 함수의 예는 무엇입니까?","c":"int max_to(int a, int b, int *out);   // 성공 1, 결과는 *out","o":["printf","strlen","scanf(\"%d\", &amp;n)","sizeof"],"a":2,"w":"scanf 는 읽은 항목 수를 반환하고 값은 &amp;n 으로 넘긴 주소에 씁니다. strtol 도 같은 모양입니다.","an":"1교시 빈칸 1-1"}]},{"t":"2교시 · 포인터 산술과 const","anim":"D2-2 p+1 은 몇 바이트","qs":[{"p":"int *p 에서 p + 1 은 몇 바이트 뒤의 주소입니까? (x86-64)","c":"int arr[5];\nint *p = arr;\nprintf(\"%p %p\\n\", p, p + 1);","o":["1","4","8","알 수 없다"],"a":1,"w":"p + n 은 n × sizeof(*p) 바이트 이동합니다. int 는 4바이트이므로 p + 1 은 4바이트 뒤입니다.","an":"D2-2 · int *"},{"p":"double *q 에서 q + 2 는 몇 바이트 뒤입니까?","c":"","o":["2","8","16","24"],"a":2,"w":"2 × sizeof(double) = 2 × 8 = 16 바이트입니다. 타입이 보폭을 결정합니다.","an":"D2-2 · double *"},{"p":"아래 뺄셈의 결과는 무엇입니까?","c":"int arr[5];\nprintf(\"%ld\\n\", (long)(&amp;arr[4] - &amp;arr[0]));","o":["16 (바이트 수)","4 (요소 개수)","1","5"],"a":1,"w":"같은 타입 포인터끼리의 뺄셈은 바이트가 아니라 요소 개수입니다. 바이트 차이를 보려면 (char *) 로 캐스팅합니다.","an":"2교시 예제 2-1"},{"p":"리틀 엔디안 센서 바이트를 아래처럼 읽었을 때 w[0] 의 값은 얼마입니까?","c":"uint8_t buf[4] = {0x2C, 0x01, 0x3C, 0x00};\nuint16_t *w = (uint16_t *)buf;","o":["0x2C01 = 11265","0x012C = 300","44","1"],"a":1,"w":"리틀 엔디안이라 첫 바이트 0x2C 가 하위, 0x01 이 상위입니다. 0x012C = 300.","an":"2교시 예제 2-2"},{"p":"임베디드에서 포인터 캐스팅 대신 아래처럼 바이트를 조립하는 것을 권장하는 이유는 무엇입니까?","c":"uint16_t dist = buf[0] | (buf[1] &lt;&lt; 8);","o":["더 짧아서","정렬(alignment)과 엔디안에 관계없이 이식성이 보장되기 때문","컴파일이 빨라서","캐스팅은 C 에서 금지라서"],"a":1,"w":"정렬이 맞지 않는 주소를 uint32_t * 로 읽으면 일부 MCU 에서 죽습니다. 바이트 조립은 어디서나 같은 결과를 냅니다.","an":"2교시 예제 2-2"},{"p":"아래 선언에서 허용되지 않는 것은 무엇입니까?","c":"int a = 1, b = 2;\nconst int *p1 = &amp;a;","o":["p1 = &amp;b;","*p1 = 9;","printf(\"%d\", *p1);","p1 = NULL;"],"a":1,"w":"const int * 는 \"가리키는 값이 const\" 입니다. 포인터 자체는 다른 곳으로 옮길 수 있지만 그 값을 바꿀 수는 없습니다.","an":"2교시 예제 2-3"},{"p":"아래 선언에서 허용되지 않는 것은 무엇입니까?","c":"int a = 1, b = 2;\nint *const p2 = &amp;a;","o":["*p2 = 9;","p2 = &amp;b;","printf(\"%d\", *p2);","(*p2)++;"],"a":1,"w":"int *const 는 \"포인터가 const\" 입니다. 가리키는 값은 바꿀 수 있지만 다른 곳을 가리키게 할 수 없습니다.","an":"2교시 예제 2-3"},{"p":"함수 매개변수를 아래처럼 선언하는 이유는 무엇입니까?","c":"int sum(const int *a, int n);","o":["속도가 빨라진다","이 함수가 배열을 읽기만 한다는 약속이며 컴파일러가 수정을 막아 준다","배열 복사를 막는다","n 을 생략할 수 있다"],"a":1,"w":"호출자는 함수가 배열을 훼손하지 않을 것을 알 수 있고, 함수 안에서 실수로 a[i] = … 를 쓰면 컴파일 에러가 납니다.","an":"2교시 예제 2-3"},{"p":"char *c 에서 c + 1 은 몇 바이트 뒤입니까?","c":"","o":["1","2","4","8"],"a":0,"w":"sizeof(char) 는 항상 1 입니다. 그래서 바이트 단위로 메모리를 훑을 때 char * 나 uint8_t * 로 캐스팅합니다.","an":"D2-2 · char *"},{"p":"아래 코드의 출력은 무엇입니까?","c":"int arr[5] = {10, 20, 30, 40, 50};\nint *p = arr;\nprintf(\"%d\\n\", *(p + 2));","o":["20","30","12","주소값"],"a":1,"w":"p + 2 는 arr[2] 의 주소이고 * 로 그 값 30 을 읽습니다. arr[2] 와 완전히 같은 뜻입니다.","an":"2교시 예제 2-1"}]},{"t":"3교시 · 배열과 포인터","anim":"D2-3 배열 감쇠","qs":[{"p":"아래 세 식의 값은 각각 무엇입니까?","c":"int arr[5] = {10, 20, 30, 40, 50};\nprintf(\"%d %d %d\\n\", arr[2], *(arr + 2), 2[arr]);","o":["30 30 컴파일 에러","30 30 30","30 주소 30","20 30 40"],"a":1,"w":"arr[i] 는 *(arr + i) 의 문법 설탕입니다. 덧셈은 교환 가능하므로 2[arr] 도 같은 값입니다 (쓰지는 마세요).","an":"3교시 예제 3-1"},{"p":"main 에서 아래 sizeof 의 값은 얼마입니까?","c":"int arr[5];\nprintf(\"%zu\\n\", sizeof(arr));","o":["5","8","20","40"],"a":2,"w":"배열 전체 크기 = 5 × sizeof(int) = 20 바이트입니다. 함수 안으로 넘어가면 달라집니다.","an":"D2-3 · main 프레임"},{"p":"같은 배열을 함수에 넘겼을 때 함수 안의 sizeof(arr) 는 얼마입니까?","c":"void show(int arr[]) {\n    printf(\"%zu\\n\", sizeof(arr));\n}\nshow(arr);","o":["20","8","5","4"],"a":1,"w":"매개변수 int arr[] 는 사실 int *arr 입니다. 배열은 첫 요소의 주소로 감쇠(decay)되어 넘어가므로 포인터 크기 8 이 나옵니다.","an":"D2-3 · show 프레임"},{"p":"배열 요소 개수를 구하는 관용구는 무엇입니까?","c":"int arr[5];\nint n = ____;","o":["sizeof(arr)","sizeof(arr) / sizeof(arr[0])","strlen(arr)","arr.length"],"a":1,"w":"전체 바이트 ÷ 요소 하나의 바이트. 단, 감쇠된 포인터에는 쓸 수 없으므로 main 처럼 배열 선언이 보이는 곳에서만 씁니다.","an":"3교시 예제 3-1"},{"p":"배열을 함수에 넘길 때 길이를 함께 넘기는 이유는 무엇입니까?","c":"int sum(const int *a, int n);\nsum(arr, 5);","o":["C 문법 규칙","감쇠되면서 길이 정보가 사라지기 때문","속도를 위해","포인터는 길이를 저장할 수 없어서(같은 뜻)"],"a":1,"w":"함수는 첫 요소 주소만 받습니다. 요소가 몇 개인지는 호출자만 알므로 (배열, 길이) 를 항상 짝으로 넘깁니다.","an":"3교시 예제 3-2"},{"p":"아래 2차원 배열에서 m[1][0] 은 시작 주소로부터 몇 바이트 뒤에 있습니까?","c":"int m[2][3] = {{1,2,3},{4,5,6}};","o":["3","4","12","24"],"a":2,"w":"행 우선 저장이라 한 행(3 × 4 = 12 바이트)을 건너뛴 곳입니다. m[i][j] 의 오프셋 = (i × 3 + j) × 4.","an":"3교시 예제 3-3"},{"p":"2차원 배열을 함수에 넘길 때 아래처럼 열 수를 꼭 써야 하는 이유는 무엇입니까?","c":"void matmul(const int a[][3], ...);","o":["행 수는 알 수 없어서","m[i][j] 의 주소를 계산하려면 한 행의 길이를 알아야 하기 때문","C 문법상 모든 차원을 써야 해서","포인터 배열이라서"],"a":1,"w":"a[i][j] = *(a + i × 열수 + j) 이므로 열 수가 없으면 두 번째 행이 어디서 시작하는지 알 수 없습니다.","an":"3교시 빈칸 3-1"},{"p":"아래 코드의 출력은 무엇입니까?","c":"int m[2][3] = {{1,2,3},{4,5,6}};\nint *flat = &amp;m[0][0];\nprintf(\"%d\\n\", flat[4]);","o":["4","5","2","컴파일 에러"],"a":1,"w":"2차원 배열은 메모리상 한 덩어리(1 2 3 4 5 6)입니다. flat[4] 는 다섯 번째 요소 5.","an":"3교시 예제 3-3"},{"p":"아래 함수가 n 이 0 일 때 0 을 반환하도록 한 이유는 무엇입니까?","c":"double avg(const double *a, int n) {\n    double s = 0;\n    for (int i = 0; i &lt; n; i++) s += a[i];\n    return n ? s / n : 0;\n}","o":["속도","0 으로 나누기를 피하기 위해","배열이 비면 컴파일 에러라서","평균은 항상 0 이상이라서"],"a":1,"w":"빈 배열의 평균은 정의되지 않습니다. 0 나누기는 실수에서 inf/NaN, 정수에서 크래시입니다.","an":"3교시 예제 3-4"},{"p":"배열 이름 arr 과 &amp;arr[0] 의 관계로 옳은 것은 무엇입니까?","c":"printf(\"%p %p\\n\", (void *)arr, (void *)&amp;arr[0]);","o":["다른 주소","같은 주소 — 배열 이름은 식 안에서 첫 요소 주소로 감쇠한다","arr 은 주소가 아니다","컴파일 에러"],"a":1,"w":"sizeof 와 &amp; 를 제외한 대부분의 문맥에서 배열 이름은 첫 요소의 주소로 바뀝니다.","an":"D2-3"}]},{"t":"4교시 · 정렬과 검색","anim":"D2-4 버블 정렬 · 이진 검색","qs":[{"p":"버블 정렬 안쪽 루프의 상한이 n - 1 - i 인 이유는 무엇입니까?","c":"for (int i = 0; i &lt; n - 1; i++)\n    for (int j = 0; j &lt; n 을 뒤집는다","문자열 길이를 센다"],"a":1,"w":"대입식의 값은 복사한 문자입니다. '\\0' 을 복사한 직후 비교가 거짓이 되어 멈추므로 널 문자까지 복사됩니다.","an":"5교시 예제 5-2"},{"p":"strcmp(a, b) 가 0 을 반환하면 어떤 뜻입니까?","c":"if (strcmp(cmd, \"quit\") == 0) break;","o":["a 가 b 보다 작다","두 문자열이 같다","두 문자열이 다르다","오류"],"a":1,"w":"0 이면 같음, 음수면 a 가 사전순으로 앞, 양수면 뒤입니다. if (strcmp(a, b)) 는 \"다르면\"이라 자주 헷갈립니다.","an":"5교시 예제 5-2"},{"p":"아래 코드의 출력은 무엇입니까?","c":"const char *frame = \"$T=25.3,H=60,D=120*\";\nconst char *t = strstr(frame, \"T=\");\nprintf(\"%.1f\\n\", atof(t + 2));","o":["0.0","25.3","25.3,H=60,D=120*","에러"],"a":1,"w":"strstr 은 \"T=\" 가 시작하는 주소를 돌려주고, t + 2 는 그 뒤 \"25.3,…\" 입니다. atof 는 숫자가 끝나는 콤마에서 멈춥니다.","an":"5교시 예제 5-3"},{"p":"atoi / atof 의 단점은 무엇입니까?","c":"atoi(\"abc\")    // 0\natoi(\"0\")      // 0","o":["느리다","실패해도 0 을 돌려줘 실패와 진짜 0 을 구분할 수 없다","문자열을 수정한다","헤더가 없다"],"a":1,"w":"실패를 알아야 할 때는 strtol / strtod 의 끝 포인터(end)를 씁니다 — 6교시.","an":"5교시 예제 5-3"},{"p":"아래 코드를 실행하면 어떻게 됩니까?","c":"char buf[8];\nstrcpy(buf, \"ESP32-SENSOR\");   // 13 + 1 바이트","o":["자동으로 잘려서 복사된다","경고 후 실행되며 스택을 덮어 stack smashing detected 로 종료되거나 조용히 다른 변수를 망친다","컴파일 에러","buf 가 커진다"],"a":1,"w":"C 는 복사 길이를 검사하지 않습니다. 사용자 입력이 여기로 들어오면 보안 취약점(buffer overflow)입니다.","an":"5교시 예제 5-4 · D2-5"},{"p":"문자열을 제자리에서 뒤집는 아래 함수에서 b 의 초기값이 s + strlen(s) - 1 인 이유는 무엇입니까?","c":"char *a = s, *b = s + strlen(s) - 1;\nwhile (a &lt; b) { char t = *a; *a = *b; *b = t; a++; b--; }","o":["strlen 이 1 작게 나와서","s + strlen(s) 는 '\\0' 자리이므로 그 앞이 마지막 글자이기 때문","배열은 1 부터 시작해서","b 가 음수가 되지 않게"],"a":1,"w":"널 문자를 뒤집으면 문자열이 첫 글자에서 끝나 버립니다. 마지막 \"글자\"는 널 바로 앞입니다.","an":"5교시 빈칸 5-1"}]},{"t":"6교시 · 안전한 문자열 처리와 파싱","anim":"D2-6 strtok 분리","qs":[{"p":"scanf(\"%s\", buf) 대신 fgets 를 쓰라고 하는 이유는 무엇입니까?","c":"char line[32];\nfgets(line, sizeof line, stdin);","o":["fgets 가 더 빠르다","fgets 는 버퍼 크기를 알고 그 안에서만 읽어 오버플로를 막기 때문","scanf 는 문자열을 못 읽는다","fgets 는 숫자도 변환한다"],"a":1,"w":"scanf(\"%s\") 는 입력이 얼마나 긴지 모른 채 복사합니다. fgets 는 최대 n-1 글자만 읽고 널을 붙입니다.","an":"6교시 예제 6-1"},{"p":"fgets 로 읽은 줄 끝의 개행을 제거하는 아래 한 줄의 원리는 무엇입니까?","c":"line[strcspn(line, \"\\n\")] = '\\0';","o":["마지막 글자를 무조건 지운다","'\\n' 이 처음 나오는 위치(없으면 끝)를 찾아 그 자리에 널을 써서 문자열을 끊는다","개행을 공백으로 바꾼다","줄 전체를 지운다"],"a":1,"w":"strcspn 은 \"\\n\" 이 나오기 전까지의 길이입니다. 개행이 없으면 strlen 과 같아 기존 널 위에 널을 쓰므로 안전합니다.","an":"6교시 예제 6-1"},{"p":"아래 strncpy 의 문제는 무엇입니까?","c":"char a[4];\nstrncpy(a, \"ABCDEFG\", 4);\nprintf(\"%s\\n\", a);","o":["4 글자만 복사돼서 에러","4 칸을 다 채우면 '\\0' 을 붙이지 않아 printf 가 옆 메모리까지 읽는다","strncpy 는 표준이 아니다","A 만 복사된다"],"a":1,"w":"strncpy 는 이름과 달리 널 종료를 보장하지 않습니다. 잘라서 복사할 때는 snprintf 를 쓰세요.","an":"6교시 예제 6-2"},{"p":"잘라서 복사할 때 권장하는 안전한 방법은 무엇입니까?","c":"char b[4];\n____;\nprintf(\"%s\\n\", b);    // ABC","o":["strcpy(b, \"ABCDEFG\")","snprintf(b, sizeof b, \"%s\", \"ABCDEFG\")","strncpy(b, \"ABCDEFG\", 3)","memcpy(b, \"ABCDEFG\", 4)"],"a":1,"w":"snprintf 는 버퍼 크기 안에서 자르고 항상 '\\0' 을 붙입니다.","an":"6교시 예제 6-2"},{"p":"strtok 이 원본 문자열에 하는 일은 무엇입니까?","c":"char line[] = \"$T=25.3,H=60,D=120*\";\nchar *tok = strtok(line + 1, \",\");","o":["복사본을 만든다","구분자 자리에 '\\0' 을 써 넣고 그 앞 토큰의 시작 주소를 돌려준다","구분자를 공백으로 바꾼다","아무것도 바꾸지 않는다"],"a":1,"w":"그래서 원본이 바뀌고, 읽기 전용 리터럴(char *)에는 쓸 수 없습니다. 배열 복사본에 써야 합니다.","an":"D2-6"},{"p":"두 번째 이후 토큰을 얻을 때 첫 인자로 NULL 을 넘기는 이유는 무엇입니까?","c":"tok = strtok(NULL, \",\");","o":["새 문자열을 시작한다","strtok 이 내부에 저장한 \"지난번 멈춘 위치\"부터 이어서 자르라는 뜻","NULL 은 빈 문자열이라서","에러 처리"],"a":1,"w":"strtok 은 정적 변수로 위치를 기억합니다. 그래서 두 문자열을 번갈아 자를 수 없고 스레드 안전하지도 않습니다(strtok_r 사용).","an":"6교시 예제 6-3"},{"p":"아래 strtol 호출 후 end 는 어디를 가리킵니까?","c":"char *end;\nlong v = strtol(\"120*\", &amp;end, 10);","o":["\"120*\" 의 시작","'*' 위치 — 숫자가 끝난 곳","문자열 끝 '\\0'","NULL"],"a":1,"w":"end 는 변환이 멈춘 위치입니다. 이것으로 \"얼마나 읽었는지\"와 \"하나도 못 읽었는지(end == 시작)\"를 알 수 있습니다.","an":"6교시 예제 6-3"},{"p":"strtol 로 \"숫자를 하나도 읽지 못했다\"를 판정하는 조건은 무엇입니까?","c":"long v = strtol(p, &amp;end, 10);\nif (____) return 0;   // 실패","o":["v == 0","end == p","end == NULL","v &lt; 0"],"a":1,"w":"실패하면 end 가 시작 위치 그대로입니다. v == 0 은 진짜 \"0\" 을 읽은 경우와 구분되지 않습니다.","an":"6교시 빈칸 6-1"},{"p":"parse_frame 이 실패했을 때 out 을 건드리지 않도록 한 이유는 무엇입니까?","c":"if (!get_num(line, \"D=\", &amp;d)) return 0;   // out 은 아직 그대로\nout-&gt;t = t; out-&gt;h = (int)h; out-&gt;d = (int)d;\nreturn 1;","o":["속도","호출자가 반쯤 채워진 구조체를 유효한 값으로 오해하지 않게 하기 위해","구조체는 부분 대입이 안 돼서","C 규칙"],"a":1,"w":"실패 시 상태를 바꾸지 않는 것은 API 설계의 기본 규칙입니다. 호출자는 반환값만 보고 안심하고 out 을 씁니다.","an":"6교시 예제 6-4"},{"p":"frame.c 의 get_num 을 static 으로 선언한 이유는 무엇입니까?","c":"static int get_num(const char *src, const char *key, double *val);","o":["값을 유지하려고","이 파일 안에서만 쓰는 도우미 함수라 밖으로 이름을 노출하지 않기 위해","더 빠르게","헤더에 넣지 않으면 에러라서"],"a":1,"w":"Day 1 7교시의 파일 범위 static 입니다. 다른 파일에 같은 이름의 함수가 있어도 충돌하지 않습니다.","an":"6교시 예제 6-4"}]},{"t":"7교시 · 동적 메모리","anim":"D2-7 힙 할당·해제","qs":[{"p":"아래 함수의 문제는 무엇입니까?","c":"int *make(int n) {\n    int a[10];\n    return a;      // ?\n}","o":["n 을 안 써서","스택 배열의 주소를 돌려주는데 함수가 끝나면 그 메모리는 사라진다","10 이 너무 작아서","return 은 배열을 못 돌려줘서"],"a":1,"w":"지역 변수는 프레임과 함께 사라집니다. 함수가 끝나도 살아야 하는 데이터는 malloc 으로 힙에 둡니다.","an":"7교시 예제 7-1"},{"p":"malloc 의 반환값을 사용하기 전에 반드시 해야 할 일은 무엇입니까?","c":"int *a = malloc(n * sizeof(int));\n____","o":["memset 으로 0 채우기","NULL 인지 검사하기","free 하기","sizeof 확인"],"a":1,"w":"메모리가 부족하면 NULL 이 돌아옵니다. PC 에서는 드물지만 MCU 에서는 실제로 일어나므로 항상 검사합니다.","an":"7교시 예제 7-1"},{"p":"malloc 과 calloc 의 차이는 무엇입니까?","c":"int *a = malloc(3 * sizeof(int));\nint *b = calloc(3, sizeof(int));","o":["calloc 이 더 빠르다","calloc 은 할당한 메모리를 0 으로 채워 준다","malloc 은 힙, calloc 은 스택","차이 없음"],"a":1,"w":"malloc 의 내용은 쓰레기 값입니다. 0 초기화가 필요하면 calloc.","an":"7교시"},{"p":"realloc 을 아래처럼 쓰면 어떤 위험이 있습니까?","c":"a = realloc(a, cap * 2 * sizeof(int));","o":["없음","realloc 이 실패해 NULL 을 돌려주면 원래 a 의 주소를 잃어 그 메모리가 누수된다","항상 새 주소가 된다","cap 이 0 이 된다"],"a":1,"w":"실패 시 원본은 그대로 살아 있는데 a 가 NULL 로 덮이면 free 할 방법이 없습니다. tmp 로 받는 것이 관용구입니다.","an":"7교시 예제 7-2"},{"p":"realloc 후 포인터 값이 바뀔 수 있는 이유는 무엇입니까?","c":"int *tmp = realloc(a, bigger);\nif (tmp) a = tmp;     // 주소가 달라졌을 수 있음","o":["버그","현재 자리에 늘릴 공간이 없으면 새 블록에 복사하고 옛 블록을 해제하기 때문","realloc 은 항상 새 블록","캐시 때문"],"a":1,"w":"그래서 옛 주소를 다른 변수에 복사해 두었다면 realloc 뒤에는 무효(dangling)가 됩니다.","an":"D2-7 · realloc"},{"p":"valgrind 가 아래처럼 보고했습니다. 어떤 실수입니까?","c":"LEAK SUMMARY:\n   definitely lost: 40 bytes in 1 blocks\n   at malloc ... by main (leak.c:5)","o":["해제 후 사용","free 하지 않은 블록 (메모리 누수)","이중 해제","배열 밖 접근"],"a":1,"w":"malloc 한 40 바이트를 free 하지 않고 종료했습니다. leak.c:5 가 할당한 위치입니다.","an":"7교시 예제 7-3 · D2-7 return 0"},{"p":"valgrind 가 아래처럼 보고했습니다. 어떤 실수입니까?","c":"Invalid write of size 4\n   Address 0x4a4a0a0 is 0 bytes inside a block of size 40 free'd","o":["누수","free 한 뒤에 그 메모리에 쓴 것(use-after-free)","NULL 역참조","스택 오버플로"],"a":1,"w":"free 는 메모리를 반납하지만 포인터 변수에는 옛 주소가 남습니다(dangling). 그래서 free 뒤 p = NULL 습관.","an":"7교시 예제 7-3 · D2-7 p[0] = 1"},{"p":"같은 포인터를 두 번 free 하면 어떻게 됩니까?","c":"free(p);\nfree(p);","o":["두 번째는 무시된다","정의되지 않은 동작 — valgrind 는 Invalid free() 로 잡는다","메모리가 두 배 반납된다","컴파일 에러"],"a":1,"w":"힙 관리 구조가 깨져 나중에 엉뚱한 곳에서 죽기도 합니다. free(NULL) 은 안전하므로 free 뒤 NULL 대입이 이 실수를 막습니다.","an":"D2-7 · free 두 번"},{"p":"아래 my_strdup 에서 + 1 을 빼면 어떤 일이 생깁니까?","c":"size_t n = strlen(s) + 1;\nchar *d = malloc(n);\nmemcpy(d, s, n);","o":["아무 문제 없음","'\\0' 자리가 없어 한 바이트를 힙 블록 밖에 써서 valgrind 가 Invalid write 를 보고한다","malloc 이 실패한다","문자열이 짧아진다"],"a":1,"w":"힙에서도 5교시의 오버플로가 그대로 재현됩니다. 문자열 길이에는 항상 널 한 칸을 더합니다.","an":"7교시 빈칸 7-1"},{"p":"\"반환값은 호출자가 free\" 같은 소유권 규칙을 주석에 적으라고 하는 이유는 무엇입니까?","c":"char *my_strdup(const char *s);   // 반환값은 호출자가 free","o":["컴파일러가 검사해서","누가 free 할지 불분명하면 아무도 안 하거나(누수) 둘 다 해서(이중 해제) 버그가 나기 때문","문서화 규칙","free 가 자동으로 호출돼서"],"a":1,"w":"C 에는 GC 가 없습니다. 할당과 해제의 짝을 사람이 관리하므로 규칙을 명시하는 것이 유일한 안전장치입니다.","an":"7교시 예제 7-1"}]},{"t":"8교시 · 종합 (센서 로그 분석기)","anim":"D2-8 로그 분석기 흐름","qs":[{"p":"분석기의 입력 루프로 알맞은 것은 무엇입니까?","c":"char line[64];\nwhile (____) {\n    ...\n}","o":["scanf(\"%s\", line) == 1","fgets(line, sizeof line, stdin)","gets(line)","read(line)"],"a":1,"w":"fgets 는 EOF 에서 NULL 을 돌려주므로 while 조건으로 바로 쓸 수 있고, 버퍼 크기를 넘지 않습니다. gets 는 표준에서 제거됐습니다.","an":"D2-8 · 줄 읽기"},{"p":"BAD 프레임을 만났을 때 올바른 처리는 무엇입니까?","c":"if (!parse_frame(line, &amp;r)) {\n    printf(\"BAD line %d: %s\\n\", lineno, line);\n    bad++;\n    ____;\n}","o":["return 1 — 즉시 종료","continue — 세고 다음 줄로","break","exit(0)"],"a":1,"w":"한 줄이 깨졌다고 전체를 포기하지 않습니다. 개수를 세어 마지막에 보고하고 다음 줄을 읽습니다.","an":"D2-8 · BAD 면 건너뛰기"},{"p":"Reading 배열을 힙에 두고 realloc 으로 키우는 이유는 무엇입니까?","c":"Reading *log = malloc(cap * sizeof *log);","o":["속도","입력이 몇 줄인지 미리 알 수 없기 때문","구조체는 스택에 못 둬서","정렬을 위해"],"a":1,"w":"줄 수를 모르면 고정 크기 배열은 넘치거나 낭비됩니다. cap 을 두 배씩 키우면 realloc 횟수는 log₂n 번뿐입니다.","an":"D2-8 · 힙에 누적"},{"p":"sizeof *log 라고 쓴 이유는 무엇입니까?","c":"Reading *log = malloc(cap * sizeof *log);   // sizeof(Reading) 대신","o":["짧아서","log 의 타입이 바뀌어도 크기가 자동으로 따라오기 때문","sizeof(Reading) 은 컴파일 안 돼서","포인터 크기를 구하려고"],"a":1,"w":"타입 이름을 두 번 적지 않는 관용구입니다. 나중에 Reading 을 다른 타입으로 바꿔도 이 줄은 고칠 필요가 없습니다.","an":"8교시 뼈대"},{"p":"Reading 구조체 두 개를 맞바꾸는 방법으로 옳은 것은 무엇입니까?","c":"if (a[j].t &gt; a[j + 1].t) { ____ }","o":["swap(&amp;a[j], &amp;a[j+1]) — int 용 swap 그대로","Reading t = a[j]; a[j] = a[j+1]; a[j+1] = t;","memcpy 만 가능","구조체는 대입이 안 된다"],"a":1,"w":"구조체는 = 로 통째로 복사됩니다. int 용 swap 은 타입이 달라 쓸 수 없습니다(Day 3 에서 void * 와 함수 포인터로 일반화).","an":"D2-8 · 정렬"},{"p":"온도로 정렬한 뒤 최솟값과 최댓값을 얻는 가장 간단한 방법은 무엇입니까?","c":"","o":["다시 순회한다","log[0].t 와 log[n-1].t","max_index 를 호출한다","정렬과 무관"],"a":1,"w":"정렬의 부산물입니다. 중앙값도 log[n/2] 근처에서 바로 얻습니다.","an":"D2-8 · 통계"},{"p":"n 이 0 일 때 통계를 계산하지 않고 바로 끝내는 이유는 무엇입니까?","c":"if (n == 0) { printf(\"데이터 없음\\n\"); free(log); return 0; }","o":["속도","log[0], log[n-1] 이 배열 밖이고 평균은 0 으로 나누게 되기 때문","free 를 먼저 해야 해서","C 규칙"],"a":1,"w":"빈 데이터는 특수 경우입니다. 이 한 줄이 없으면 log[-1] 접근과 0 나누기가 동시에 일어납니다.","an":"8교시 뼈대"},{"p":"제출 조건 \"valgrind definitely lost 0 bytes\" 를 만족시키려면 무엇이 필요합니까?","c":"valgrind --leak-check=full ./analyzer &lt; log.txt","o":["printf 를 줄인다","모든 경로(정상 종료, 데이터 없음, realloc 실패)에서 free(log) 가 호출되게 한다","malloc 을 안 쓴다","realloc 을 안 쓴다"],"a":1,"w":"조기 return 하는 경로에서 free 를 빠뜨리는 것이 가장 흔한 누수입니다. 뼈대의 세 return 을 모두 확인하세요.","an":"D2-8 · 해제"},{"p":"입력 100줄 테스트를 요구하는 이유는 무엇입니까?","c":"","o":["시간 측정","cap(4) 을 여러 번 넘겨 realloc 경로가 실제로 실행되는지 확인하기 위해","파일이 커야 해서","정렬 검증"],"a":1,"w":"테스트 입력이 7줄이면 realloc 이 한 번만 돌아 버그가 숨을 수 있습니다. 경계를 여러 번 넘기는 입력이 필요합니다.","an":"8교시 체크리스트"},{"p":"Day 3 예고에서 \"오늘의 버블 정렬을 qsort 로 바꾼다\"고 했습니다. qsort 에 필요한 오늘 배운 개념은 무엇입니까?","c":"qsort(log, n, sizeof *log, compare_temp);","o":["2차원 배열","배열 주소·요소 개수·요소 크기를 따로 넘기는 것(감쇠 때문) + 비교 함수 포인터","strtok","realloc"],"a":1,"w":"qsort(배열, 개수, 요소 크기, 비교 함수) — 앞 세 인자는 오늘 3교시의 \"길이를 같이 넘겨라\"의 일반형이고, 마지막이 Day 3 함수 포인터입니다.","an":"Day 3 예고"}]}];
const MARK=['1','2','3','4'];
const NOTE_KEY='c-day2-quiz-wrong';
const $=s=>document.querySelector(s);

function loadNote(){try{return new Set(JSON.parse(localStorage.getItem(NOTE_KEY)||'[]'))}catch(e){return new Set()}}
function saveNote(){try{localStorage.setItem(NOTE_KEY,JSON.stringify([...note]))}catch(e){}}
let note=loadNote();

const sel=new Set(Q.map((_,i)=>i));
let deck=[],idx=0,mode='range';

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function qid(s,k){return `Q${s+1}-${k+1}`}

function build(items){
  const so=$('#shufO').checked;
  deck=items.map(([s,k])=>({s,k,order:so?shuffle([0,1,2,3]):[0,1,2,3],pick:null}));
  if($('#shufQ').checked) shuffle(deck);
  idx=0;
}
function startRange(){
  mode='range';
  const items=[];[...sel].sort((a,b)=>a-b).forEach(s=>Q[s].qs.forEach((_,k)=>items.push([s,k])));
  build(items);render();
}
function startNote(){
  const items=[...note].map(x=>x.split('-').map(Number)).filter(([s,k])=>Q[s]&&Q[s].qs[k]);
  if(!items.length)return;
  mode='note';build(items);render();
}
function startItems(items,m){mode=m;build(items);render()}

function renderChips(){
  $('#chips').innerHTML=Q.map((s,i)=>`<button class="chip" aria-pressed="${sel.has(i)}" data-i="${i}" title="${s.t}">${i+1}교시</button>`).join('')+
    `<button class="chip" id="allChip" aria-pressed="${sel.size===Q.length}">전체</button>`;
  $('#chips').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);renderChips()});
  $('#allChip').onclick=()=>{if(sel.size===Q.length)sel.clear();else Q.forEach((_,i)=>sel.add(i));renderChips()};
  $('#startBtn').disabled=sel.size===0;
  $('#startBtn').textContent=sel.size?`이 범위로 새로 시작 (${sel.size*10}문항)`:'교시를 하나 이상 고르세요';
}
function renderNoteBtn(){
  $('#noteBtn').textContent=`오답노트 풀기 (${note.size})`;
  $('#noteBtn').disabled=note.size===0;$('#clearNoteBtn').disabled=note.size===0;
}

function counts(){let ok=0,bad=0;deck.forEach(d=>{if(d.pick===null)return;Q[d.s].qs[d.k].a===d.pick?ok++:bad++});return{ok,bad,done:ok+bad}}
function renderStatus(){
  const {ok,bad,done}=counts(),n=deck.length;
  $('#statL').innerHTML=`[ <b>${String(done).padStart(String(n).length,' ')}/${n}</b> ] ${mode==='note'?'오답노트':mode==='retry'?'틀린 문제 다시':'출제 범위'}`;
  $('#statR').innerHTML=`맞힘 <b>${ok}</b> · 틀림 <b>${bad}</b>${done?` · 정답률 <b>${Math.round(ok/done*100)}%</b>`:''}`;
  $('#barG').style.width=n?ok/n*100+'%':'0';$('#barR').style.width=n?bad/n*100+'%':'0';
}

function render(){
  renderNoteBtn();renderStatus();
  if(idx>=deck.length){renderResult();return}
  const d=deck[idx],sec=Q[d.s],q=sec.qs[d.k],done=d.pick!==null;
  const opts=d.order.map((oi,pos)=>{
    let cls='';if(done){if(oi===q.a)cls='ok';else if(oi===d.pick)cls='bad'}
    return `<button class="opt ${cls}" data-o="${oi}" ${done?'disabled':''}><span class="k">${MARK[pos]}</span><span>${q.o[oi]}</span></button>`}).join('');
  const right=done&&d.pick===q.a;
  $('#stage').innerHTML=`<article class="card">
    <div class="qmeta"><span><span class="id">${qid(d.s,d.k)}</span> · ${sec.t}</span><span>${idx+1} / ${deck.length}</span></div>
    <p class="prompt">${q.p}</p>
    ${q.c?`<pre class="qc">${q.c}</pre>`:''}
    <div class="opts">${opts}</div>
    ${done?`<div class="fb ${right?'':'bad'}"><span class="v ${right?'ok-t':'bad-t'}">${right?'정답입니다.':'오답입니다.'}</span>${q.w}<span class="src">강의 확인: ${q.an} · 🎬 ${sec.anim}</span></div>`:''}
    <div class="nav">
      <button class="btn" id="prevBtn" ${idx===0?'disabled':''}>이전</button>
      <span class="hint">키보드: 1–4 선택 · Enter 다음 · ← 이전</span>
      <button class="btn primary" id="nextBtn" ${done?'':'disabled'}>${idx===deck.length-1?'결과 보기':'다음 문제'}</button>
    </div></article>`;
  $('#stage').querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.o));
  $('#prevBtn').onclick=prev;$('#nextBtn').onclick=next;
}
function choose(oi){
  const d=deck[idx];if(d.pick!==null)return;d.pick=oi;
  const id=`${d.s}-${d.k}`;
  if(oi===Q[d.s].qs[d.k].a)note.delete(id);else note.add(id);
  saveNote();render();
}
function next(){if(deck[idx]&&deck[idx].pick!==null){idx++;render();window.scrollTo({top:0})}}
function prev(){if(idx>0){idx--;render()}}

function strip(h){const e=document.createElement('div');e.innerHTML=h;return e.textContent}
function renderResult(){
  const {ok,bad}=counts(),n=deck.length,skip=n-ok-bad;
  const per={};deck.forEach(d=>{const p=per[d.s]||(per[d.s]={n:0,ok:0});p.n++;if(d.pick===Q[d.s].qs[d.k].a)p.ok++});
  const wrong=deck.filter(d=>d.pick!==Q[d.s].qs[d.k].a).sort((a,b)=>a.s-b.s||a.k-b.k);
  const log=`$ make quiz\n`+Object.keys(per).map(Number).sort((a,b)=>a-b).map(s=>{const p=per[s],miss=p.n-p.ok;
    return `${Q[s].t.split(' · ')[0]}.c: ${miss?`<span class="w">${miss} warning${miss>1?'s':''}</span>`:'<span class="o">ok</span>'} (${p.ok}/${p.n})`}).join('\n')+
    `\n${bad+skip?`<span class="e">quiz: ${bad+skip}개 틀림</span> · `:'<span class="o">경고 0개 — 제출 조건 통과</span> · '}${ok}/${n} 맞힘 (${Math.round(ok/n*100)}%)`;
  $('#stage').innerHTML=`<article class="card result">
    <h2>결과 ${ok} / ${n}</h2>
    <pre class="log">${log}</pre>
    <div class="btns">
      ${wrong.length?`<button class="btn primary" id="retryBtn">틀린 ${wrong.length}문제 다시 풀기</button>`:''}
      <button class="btn" id="againBtn">같은 범위 처음부터</button>
    </div>
    <div class="label">틀린 문제 정리</div>
    <div class="wrong">${wrong.length?wrong.map(d=>{const q=Q[d.s].qs[d.k];
      return `<div class="witem"><span class="id">${qid(d.s,d.k)}</span><div>${q.p}</div>
        <div class="my">내 답: ${d.pick===null?'미응답':q.o[d.pick]}</div>
        <div class="co">정답: ${q.o[q.a]}</div><div class="ex">${q.w}</div></div>`}).join(''):'<p class="empty">틀린 문제가 없습니다.</p>'}</div>
  </article>`;
  const r=$('#retryBtn');if(r)r.onclick=()=>startItems(wrong.map(d=>[d.s,d.k]),'retry');
  $('#againBtn').onclick=()=>startItems(deck.map(d=>[d.s,d.k]),mode);
}

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  if(idx>=deck.length)return;
  if(/^[1-4]$/.test(e.key)){const b=$('#stage').querySelectorAll('.opt')[+e.key-1];if(b&&!b.disabled)b.click()}
  else if(e.key==='Enter'){if(document.activeElement&&document.activeElement.tagName==='BUTTON')return;next()}
  else if(e.key==='ArrowLeft')prev();
});
$('#startBtn').onclick=startRange;$('#noteBtn').onclick=startNote;
$('#clearNoteBtn').onclick=()=>{note.clear();saveNote();renderNoteBtn()};

renderChips();startRange();
</script>

</body>
